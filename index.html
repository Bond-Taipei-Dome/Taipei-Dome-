<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>體育館點位巡檢與共編系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Swiper.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>

  <!-- 全域初始化與安全降級系統 (避免 Firebase 載入失敗導致系統崩潰) -->
  <script>
    window.maps = [
      {
        id: 'map-b2-b1',
        name: 'B2 / B1層 專有共用區分圖',
        url: 'https://raw.githubusercontent.com/Bond-Taipei-Dome/TaipeiDome-maps/main/taipeidome-map-b2%26b1.jpg'
      },
      {
        id: 'map-l1-l5',
        name: 'L1 ~ L5層 專有共用區分圖',
        url: 'https://raw.githubusercontent.com/Bond-Taipei-Dome/TaipeiDome-maps/main/taipeidome-map-L1toL5.jpg'
      }
    ];

    window.pins = [
      {
        id: 'pin-demo-1',
        mapId: 'map-b2-b1',
        x: 48.5,
        y: 42.0,
        title: 'B2 專有區與共用區交界消防栓檢查',
        department: '機電營修組',
        restoreDate: '2026-05-20',
        restoreMethod: '進行壓力測試與閥門排氣作業',
        description: '現場巡檢確認圖冊對應位置，點位已於系統內與 4K 高畫質圖面精準對齊。',
        createdDate: '2026-05-02',
        images: ['https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=800&auto=format&fit=crop']
      }
    ];

    window.currentMapId = 'map-b2-b1';
    window.dbReady = false;
  </script>

  <!-- Firebase 11.6.1 模組化 SDK (具備自動錯誤攔截機制) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'stadium-inspection-master';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

    if (firebaseConfig) {
      try {
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.warn("Auth warning:", e);
          }
        };

        onAuthStateChanged(auth, (user) => {
          if (user) {
            window.dbReady = true;
            initFirestoreListeners(db, user, appId);
          } else {
            initAuth();
          }
        });
      } catch (e) {
        console.warn("Firebase init ignored, using local fallback:", e);
      }
    }

    function initFirestoreListeners(db, currentUser, appId) {
      if (!db || !currentUser) return;

      // 監聽地圖圖資
      const mapsRef = collection(db, 'artifacts', appId, 'public', 'data', 'maps');
      onSnapshot(mapsRef, (snapshot) => {
        const loadedMaps = [];
        snapshot.forEach(docSnap => loadedMaps.push(docSnap.data()));
        if (loadedMaps.length > 0) {
          window.maps = loadedMaps;
        }
        if (typeof window.renderMapTabs === 'function') window.renderMapTabs();
        if (typeof window.loadMap === 'function') window.loadMap(window.currentMapId);
      }, (err) => console.warn("Maps sync fallback:", err));

      // 監聽標註點位
      const pinsRef = collection(db, 'artifacts', appId, 'public', 'data', 'pins');
      onSnapshot(pinsRef, (snapshot) => {
        const loadedPins = [];
        snapshot.forEach(docSnap => loadedPins.push(docSnap.data()));
        window.pins = loadedPins;
        if (typeof window.renderPins === 'function') window.renderPins();
      }, (err) => console.warn("Pins sync fallback:", err));

      window.cloudSavePin = async (pinData) => {
        try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pins', pinData.id), pinData); } catch (e) {}
      };
      window.cloudDeletePin = async (pinId) => {
        try { await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pins', pinId)); } catch (e) {}
      };
      window.cloudSaveMap = async (mapData) => {
        try { await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'maps', mapData.id), mapData); } catch (e) {}
      };
    }
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pin-pulse { animation: pulse-ring 2s infinite ease-in-out; }
    .swiper-slide img { width: 100%; height: 260px; object-fit: cover; border-radius: 0.75rem; }

    /* 硬體加速與 Smooth Pan/Zoom 渲染優化 */
    #mapContainer {
      will-change: transform;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-blue-500 selection:text-white">

      </div>
      <div>
        <h1 class="font-bold text-sm md:text-base leading-tight">體育館巡檢與點位管理系統</h1>
        <p class="text-[11px] text-slate-400" id="roleBadge">
          <span class="inline-block w-2 h-2 rounded-full bg-blue-400 mr-1.5 animate-pulse"></span>訪客模式 (僅供瀏覽)
        </p>

    </div>

    <div class="flex items-center space-x-2">
      <button onclick="exportJSONData()" class="bg-slate-700/80 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center transition border border-slate-600">
        <i class="fa-solid fa-download mr-1.5 text-blue-400"></i>匯出備份
      </button>
      <button onclick="openLoginModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow-md transition flex items-center">
        <i class="fa-solid fa-lock-open mr-1.5"></i>切換權限
      </button>
    </div>
  </header>

  <!-- 樓層圖面切換頁籤 -->
  <nav class="bg-slate-800/80 border-b border-slate-700 px-4 py-2 flex items-center space-x-2 overflow-x-auto no-scrollbar z-30 shadow-inner">
    <span class="text-xs text-slate-400 shrink-0 font-semibold"><i class="fa-solid fa-layer-group mr-1.5 text-indigo-400"></i>圖面導覽:</span>
    <div id="mapTabs" class="flex space-x-2"></div>
    <button onclick="openAddMapModal()" id="addMapTabBtn" class="hidden bg-slate-700/60 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded-full text-xs shrink-0 transition border border-dashed border-slate-500 items-center">
      <i class="fa-solid fa-plus mr-1 text-emerald-400"></i>新增圖面
    </button>
  </nav>

  <!-- 主互動地圖視窗 -->
  <main class="relative flex-1 w-full bg-slate-950 overflow-hidden flex items-center justify-center min-h-[550px]" id="viewport">
    <div id="addPinTip" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 px-4 py-1.5 rounded-full text-xs font-bold shadow-2xl z-30 pointer-events-none flex items-center animate-bounce">
      <i class="fa-solid fa-crosshairs mr-1.5"></i>點擊地圖任意位置以標註巡檢點位
    </div>

    <div id="mapContainer" class="relative inline-block transition-transform duration-75 ease-out cursor-grab active:cursor-grabbing select-none" style="transform-origin: 0 0;">
      <img id="mapImage" src="" alt="場館平面圖" class="max-w-none block shadow-2xl rounded" onload="onMapLoaded()" onerror="this.src='https://placehold.co/2400x1400/1e293b/cbd5e1?text=Map+Loading+Error'">
      <div id="pinsLayer" class="absolute inset-0"></div>
    </div>

    <!-- 縮放與控制按鈕 -->
    <div class="absolute bottom-6 right-4 flex flex-col space-y-2 z-30">
      <button onclick="zoomMap(1.2)" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-xl border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-plus text-sm"></i>
      </button>
      <button onclick="zoomMap(0.8)" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-xl border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-minus text-sm"></i>
      </button>
      <button onclick="resetMapView()" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-xl border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-compress text-sm"></i>
      </button>
    </div>
  </main>

  <!-- 登入驗證彈窗 -->
  <div id="loginModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl relative">
      <button onclick="closeModal('loginModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      <div class="flex items-center space-x-2.5 mb-3">
        <div class="bg-blue-600/20 text-blue-400 p-2 rounded-xl"><i class="fa-solid fa-shield-halved text-lg"></i></div>
        <h3 class="text-base font-bold text-white">管理身分驗證</h3>
      </div>
      <p class="text-xs text-slate-400 mb-4">請輸入管理員密碼以解鎖編輯權限：</p>
      
      <form onsubmit="handleLoginSubmit(event)">
        <div class="mb-4">
          <input type="password" id="loginPassword" required placeholder="請輸入管理員密碼" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl shadow-lg text-xs transition">確認解鎖</button>

    </div>

  <!-- 新增/編輯點位 Modal -->
  <div id="pinEditModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">

        </div>

        <div class="grid grid-cols-2 gap-3">

          </div>
          <div>
            <label class="block text-xs text-slate-300 font-medium mb-1">預計復原日期</label>

          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-300 font-medium mb-1">處置方式說明</label>
          <textarea id="pinMethodInput" rows="2" placeholder="維修計畫與處置步驟..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <div>
          <label class="block text-xs text-slate-300 font-medium mb-1">詳細備註</label>
          <textarea id="pinDescInput" rows="2" placeholder="現況補充說明..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <div>

        </div>

        <div class="pt-3 flex justify-end space-x-2 border-t border-slate-700">
          <button type="button" onclick="closeModal('pinEditModal')" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl text-xs font-medium">取消</button>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-xs shadow-md">儲存點位</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 點位詳細檢視 Modal -->
  <div id="pinViewModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-700 flex justify-between items-start bg-slate-800/90">
        <div>
          <span id="viewDeptBadge" class="inline-block bg-blue-600/30 text-blue-300 border border-blue-500/30 text-[11px] px-2.5 py-0.5 rounded-full font-medium mb-1">責任單位</span>
          <h3 id="viewTitleText" class="text-lg font-bold text-white">點位名稱</h3>
        </div>
        <button onclick="closeModal('pinViewModal')" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="p-5 overflow-y-auto space-y-4 text-xs sm:text-sm flex-1">
        <div id="swiperWrapperBox" class="swiper w-full rounded-xl overflow-hidden bg-slate-900 border border-slate-700">
          <div class="swiper-wrapper" id="viewPhotosContainer"></div>
          <div class="swiper-pagination"></div>
          <div class="swiper-button-next !text-white/80 scale-75"></div>
          <div class="swiper-button-prev !text-white/80 scale-75"></div>
        </div>

        <div class="grid grid-cols-2 gap-2 bg-slate-900/60 p-3 rounded-xl border border-slate-700">
          <div><span class="text-slate-400 text-[11px] block">建立日期</span><span id="viewCreatedText" class="font-medium text-slate-200"></span></div>
          <div><span class="text-slate-400 text-[11px] block">預計復原日</span><span id="viewDateText" class="font-medium text-amber-400"></span></div>
        </div>
        <div>
          <h4 class="text-slate-400 text-[11px] font-semibold uppercase tracking-wider mb-1">處置說明</h4>
          <p id="viewMethodText" class="text-slate-200 bg-slate-900/40 p-3 rounded-xl border border-slate-700/40 leading-relaxed"></p>
        </div>
        <div>
          <h4 class="text-slate-400 text-[11px] font-semibold uppercase tracking-wider mb-1">詳細備註</h4>
          <p id="viewDescText" class="text-slate-300 bg-slate-900/40 p-3 rounded-xl border border-slate-700/40 leading-relaxed"></p>
        </div>
      </div>

      <div class="p-4 border-t border-slate-700 bg-slate-800 flex justify-between items-center">
        <button id="deletePinBtn" onclick="deleteActivePin()" class="hidden text-rose-400 hover:bg-rose-500/20 px-3 py-2 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-trash-can mr-1.5"></i>刪除點位</button>
        <button id="editPinBtn" onclick="editActivePin()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-xs font-semibold ml-auto transition"><i class="fa-solid fa-pen-to-square mr-1.5"></i>編輯內容</button>
      </div>
    </div>
  </div>

  <!-- 新增圖面 Modal -->
  <div id="addMapModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative">
      <button onclick="closeModal('addMapModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      <h3 class="text-base font-bold text-white mb-1">上傳新樓層圖面</h3>
      <p class="text-xs text-slate-400 mb-4">支援上傳高畫質圖片 (JPG/PNG) 作為圖資：</p>
      
      <form onsubmit="handleAddNewMap(event)" class="space-y-4 text-xs">
        <div>
          <label class="block text-slate-300 font-medium mb-1">圖面名稱 (例如：3F 綜合球場)</label>
          <input type="text" id="newMapNameInput" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block text-slate-300 font-medium mb-1">選擇圖片檔案</label>
          <input type="file" id="newMapFileInput" accept="image/*" required class="w-full text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl shadow-md transition">確認上傳</button>
      </form>
    </div>
  </div>

  <!-- Toast 提示訊息 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-5 py-3 rounded-2xl shadow-2xl z-50 flex items-center space-x-3 transition-all duration-300 opacity-0 pointer-events-none">
    <i id="toastIcon" class="fa-solid fa-circle-info text-blue-400 text-lg"></i>
    <span id="toastMsg" class="text-xs font-medium"></span>
  </div>

  <script>
    const ROLES = { VISITOR: 'VISITOR', ADMIN: 'ADMIN', SUPERADMIN: 'SUPERADMIN' };
    let currentRole = ROLES.VISITOR;
    
    let activeImages = [];
    let viewingPinId = null;
    let swiperInstance = null;

    // 滑動與縮放狀態變數
    let scale = 1, panX = 0, panY = 0, isDragging = false;
    let startX = 0, startY = 0;
    let initialTouchDistance = 0;
    let initialScale = 1;
    let isTransformPending = false;

    let viewport, container, mapImg;

    window.addEventListener('DOMContentLoaded', () => {
      viewport = document.getElementById('viewport');
      container = document.getElementById('mapContainer');
      mapImg = document.getElementById('mapImage');

      renderMapTabs();
      loadMap(window.currentMapId);
      setupInteractions();
    });

    window.renderMapTabs = renderMapTabs;
    window.loadMap = loadMap;
    window.renderPins = renderPins;

    function handleLoginSubmit(e) {
      e.preventDefault();
      const pwd = document.getElementById('loginPassword').value.trim();
      const badge = document.getElementById('roleBadge');
      const addMapBtn = document.getElementById('addMapTabBtn');

      if (pwd === 'admin') {
        currentRole = ROLES.ADMIN;
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-1.5"></span>巡檢管理員 (可新增/編輯點位)`;
        if(addMapBtn) addMapBtn.classList.remove('hidden');
        showToast('已解鎖：巡檢管理員', 'success');
      } else if (pwd === 'superadmin') {
        currentRole = ROLES.SUPERADMIN;
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-purple-400 mr-1.5 animate-pulse"></span>超級管理員 (完整掌控權)`;
        if(addMapBtn) addMapBtn.classList.remove('hidden');
        showToast('已解鎖：超級管理員', 'success');
      } else {
        currentRole = ROLES.VISITOR;
        showToast('密碼錯誤，維持訪客身分', 'error');
      }
      closeModal('loginModal');
      document.getElementById('loginPassword').value = '';
      renderPins();
    }
    window.handleLoginSubmit = handleLoginSubmit;

    function openLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
    window.openLoginModal = openLoginModal;

    function renderMapTabs() {
      const tabs = document.getElementById('mapTabs');
      if (!tabs) return;
      tabs.innerHTML = '';
      (window.maps || []).forEach(m => {
        const active = m.id === window.currentMapId;
        const btn = document.createElement('button');
        btn.className = `px-3.5 py-1 rounded-full text-xs font-medium transition ${active ? 'bg-blue-600 text-white shadow-md font-semibold' : 'bg-slate-700/60 hover:bg-slate-700 text-slate-300'}`;
        btn.innerText = m.name;
        btn.onclick = () => switchMap(m.id);
        tabs.appendChild(btn);
      });
    }

    function switchMap(mapId) {
      window.currentMapId = mapId;
      renderMapTabs();
      loadMap(mapId);
    }
    window.switchMap = switchMap;

    function loadMap(mapId) {
      const target = (window.maps || []).find(m => m.id === mapId) || window.maps[0];
      if (target && mapImg) {
        window.currentMapId = target.id;
        mapImg.src = target.url;
      }
      renderPins();
    }

    function onMapLoaded() { resetMapView(); renderPins(); }
    window.onMapLoaded = onMapLoaded;

    function renderPins() {
      const layer = document.getElementById('pinsLayer');
      if (!layer) return;
      layer.innerHTML = '';
      if (!window.currentMapId) return;

      const list = (window.pins || []).filter(p => p.mapId === window.currentMapId);
      list.forEach(pin => {
        const el = document.createElement('div');
        el.className = 'absolute z-20 cursor-pointer group -translate-x-1/2 -translate-y-full';
        el.style.left = `${pin.x}%`;
        el.style.top = `${pin.y}%`;

        el.innerHTML = `
          <div class="relative flex flex-col items-center">
            <div class="absolute -inset-2 rounded-full bg-rose-500/40 pin-pulse pointer-events-none"></div>
            <div class="relative bg-gradient-to-tr from-rose-600 to-red-500 text-white w-9 h-9 rounded-full shadow-2xl border-2 border-white flex items-center justify-center transition-transform group-hover:scale-125">
              <i class="fa-solid fa-location-dot text-sm drop-shadow"></i>
            </div>
            <div class="mt-1 whitespace-nowrap bg-slate-900/95 text-white text-[11px] font-bold px-2 py-0.5 rounded-md shadow-xl border border-slate-700 pointer-events-none">
              ${pin.title}
            </div>
          </div>
        `;
        el.onclick = (e) => { e.stopPropagation(); openPinViewModal(pin.id); };
        layer.appendChild(el);
      });
    }

    function setupInteractions() {
      if (!viewport || !container) return;
      let isMoved = false;

      const getTouchDistance = (e) => {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.hypot(dx, dy);
      };

      const startPan = (cx, cy) => {
        isDragging = true;
        isMoved = false;
        startX = cx - panX;
        startY = cy - panY;
      };

      const movePan = (cx, cy) => {
        if (!isDragging) return;
        const nextPanX = cx - startX;
        const nextPanY = cy - startY;

        if (Math.abs(nextPanX - panX) > 2 || Math.abs(nextPanY - panY) > 2) {
          isMoved = true;
        }

        panX = nextPanX;
        panY = nextPanY;
        requestUpdateTransform();
      };

      const endPan = () => {
        isDragging = false;
        initialTouchDistance = 0;
      };

      // Mouse 事件
      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        startPan(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) movePan(e.clientX, e.clientY);
      });

      window.addEventListener('mouseup', endPan);

      // Touch 觸控事件
      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          startPan(e.touches[0].clientX, e.touches[0].clientY);
        } else if (e.touches.length === 2) {
          isDragging = false;
          initialTouchDistance = getTouchDistance(e);
          initialScale = scale;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isDragging) {
          movePan(e.touches[0].clientX, e.touches[0].clientY);
        } else if (e.touches.length === 2 && initialTouchDistance > 0) {
          const currentDistance = getTouchDistance(e);
          const zoomFactor = currentDistance / initialTouchDistance;
          scale = Math.min(Math.max(0.4, initialScale * zoomFactor), 5);
          requestUpdateTransform();
        }
      }, { passive: true });

      window.addEventListener('touchend', endPan);

      container.onclick = (e) => {
        if (isMoved || currentRole === ROLES.VISITOR) {
          if (currentRole === ROLES.VISITOR && !isMoved) {
            showToast('請先切換至管理員身分以新增點位', 'info');
          }
          return;
        }
        const rect = container.getBoundingClientRect();
        const px = (((e.clientX - rect.left) / rect.width) * 100).toFixed(1);
        const py = (((e.clientY - rect.top) / rect.height) * 100).toFixed(1);
        openAddPinModal(px, py);
      };

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.12 : 0.88;
        zoomMap(zoomFactor);
      }, { passive: false });
    }

    function requestUpdateTransform() {
      if (!isTransformPending && container) {
        isTransformPending = true;
        requestAnimationFrame(() => {
          container.style.transform = `translate3d(${panX}px, ${panY}px, 0px) scale(${scale})`;
          isTransformPending = false;
        });
      }
    }

    function zoomMap(f) {
      scale = Math.min(Math.max(0.4, scale * f), 5);
      requestUpdateTransform();
    }
    window.zoomMap = zoomMap;

    function resetMapView() {
      scale = 1;
      panX = 0;
      panY = 0;
      requestUpdateTransform();
    }
    window.resetMapView = resetMapView;

    function closeModal(id) { 
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden'); 
    }
    window.closeModal = closeModal;

    function openAddPinModal(x, y) {
      document.getElementById('pinForm').reset();
      document.getElementById('editPinId').value = '';
      document.getElementById('editPinX').value = x;
      document.getElementById('editPinY').value = y;
      document.getElementById('pinModalTitle').innerText = '新增巡檢點位';
      activeImages = [];
      document.getElementById('imagePreviewStrip').innerHTML = '';
      document.getElementById('pinEditModal').classList.remove('hidden');
    }

    function onImagesSelected(e) {
      const files = Array.from(e.target.files);
      files.forEach(f => {
        compressImage(f, 1200, 0.8, (base64Url) => {
          activeImages.push(base64Url);
          renderImagePreview();
        });
      });
    }
    window.onImagesSelected = onImagesSelected;

    function compressImage(file, maxWidth, quality, callback) {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxWidth) {
            h = Math.round((h * maxWidth) / w);
            w = maxWidth;
          }
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          const compressedDataUrl = canvas.toDataURL('image/jpeg', quality);
          callback(compressedDataUrl);
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function renderImagePreview() {
      const strip = document.getElementById('imagePreviewStrip');
      if (!strip) return;
      strip.innerHTML = '';
      activeImages.forEach((src) => {
        const div = document.createElement('div');
        div.className = 'relative shrink-0 w-16 h-16 rounded-lg overflow-hidden border border-slate-600';
        div.innerHTML = `<img src="${src}" class="w-full h-full object-cover">`;
        strip.appendChild(div);
      });
    }

    function handleSavePin(e) {
      e.preventDefault();
      const id = document.getElementById('editPinId').value || `pin-${Date.now()}`;
      const existing = window.pins.find(p => p.id === id);

      const pinData = {
        id,
        mapId: window.currentMapId,
        x: parseFloat(document.getElementById('editPinX').value),
        y: parseFloat(document.getElementById('editPinY').value),
        title: document.getElementById('pinTitleInput').value.trim(),
        department: document.getElementById('pinDeptInput').value.trim(),
        restoreDate: document.getElementById('pinDateInput').value,
        restoreMethod: document.getElementById('pinMethodInput').value.trim(),
        description: document.getElementById('pinDescInput').value.trim(),
        createdDate: existing ? existing.createdDate : new Date().toISOString().split('T')[0],
        images: activeImages.length > 0 ? [...activeImages] : ['https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=800&auto=format&fit=crop']
      };

      const idx = window.pins.findIndex(p => p.id === id);
      if (idx >= 0) window.pins[idx] = pinData;
      else window.pins.push(pinData);

      renderPins();
      if (window.cloudSavePin) window.cloudSavePin(pinData);
      closeModal('pinEditModal');
      showToast('點位儲存成功！', 'success');
    }
    window.handleSavePin = handleSavePin;

    function openPinViewModal(id) {
      const pin = window.pins.find(p => p.id === id);
      if (!pin) return;
      viewingPinId = id;

      document.getElementById('viewTitleText').innerText = pin.title;
      document.getElementById('viewDeptBadge').innerText = `責任單位：${pin.department}`;
      document.getElementById('viewCreatedText').innerText = pin.createdDate || '';
      document.getElementById('viewDateText').innerText = pin.restoreDate || '未設定';
      document.getElementById('viewMethodText').innerText = pin.restoreMethod || '無';
      document.getElementById('viewDescText').innerText = pin.description || '無';

      document.getElementById('editPinBtn').classList.toggle('hidden', currentRole === ROLES.VISITOR);
      document.getElementById('deletePinBtn').classList.toggle('hidden', currentRole !== ROLES.SUPERADMIN);

      const wrapper = document.getElementById('viewPhotosContainer');
      wrapper.innerHTML = '';
      (pin.images || []).forEach(src => {
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `<img src="${src}">`;
        wrapper.appendChild(slide);
      });

      if (swiperInstance) swiperInstance.destroy();
      swiperInstance = new Swiper('#swiperWrapperBox', {
        pagination: { el: '.swiper-pagination', clickable: true },
        navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }
      });
      document.getElementById('pinViewModal').classList.remove('hidden');
    }

    function editActivePin() {
      const pin = window.pins.find(p => p.id === viewingPinId);
      if (!pin) return;
      closeModal('pinViewModal');
      document.getElementById('editPinId').value = pin.id;
      document.getElementById('editPinX').value = pin.x;
      document.getElementById('editPinY').value = pin.y;
      document.getElementById('pinTitleInput').value = pin.title;
      document.getElementById('pinDeptInput').value = pin.department;
      document.getElementById('pinDateInput').value = pin.restoreDate || '';
      document.getElementById('pinMethodInput').value = pin.restoreMethod || '';
      document.getElementById('pinDescInput').value = pin.description || '';
      document.getElementById('pinModalTitle').innerText = '編輯巡檢點位';
      activeImages = pin.images ? [...pin.images] : [];
      renderImagePreview();
      document.getElementById('pinEditModal').classList.remove('hidden');
    }
    window.editActivePin = editActivePin;

    function deleteActivePin() {
      if (!viewingPinId || !confirm('確定要永久刪除此點位嗎？')) return;
      if (window.cloudDeletePin) window.cloudDeletePin(viewingPinId);
      window.pins = window.pins.filter(p => p.id !== viewingPinId);
      renderPins();
      closeModal('pinViewModal');
      showToast('已刪除點位', 'info');
    }
    window.deleteActivePin = deleteActivePin;

    function openAddMapModal() { document.getElementById('addMapModal').classList.remove('hidden'); }
    window.openAddMapModal = openAddMapModal;

    function handleAddNewMap(e) {
      e.preventDefault();
      const name = document.getElementById('newMapNameInput').value.trim();
      const fileInput = document.getElementById('newMapFileInput');
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const newMap = {
            id: `map-${Date.now()}`,
            name: name,
            url: ev.target.result
          };
          window.maps.push(newMap);
          if (window.cloudSaveMap) window.cloudSaveMap(newMap);
          renderMapTabs();
          switchMap(newMap.id);
          closeModal('addMapModal');
          showToast('新圖面新增成功！', 'success');
        };
        reader.readAsDataURL(fileInput.files[0]);
      }
    }
    window.handleAddNewMap = handleAddNewMap;

    function exportJSONData() {
      const data = { maps: window.maps, pins: window.pins };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `stadium-backup-${new Date().toISOString().split('T')[0]}.json`;
      a.click();
      showToast('資料備份匯出成功！', 'success');
    }
    window.exportJSONData = exportJSONData;

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      if (!toast) return;
      document.getElementById('toastMsg').innerText = msg;
      const icon = document.getElementById('toastIcon');
      icon.className = type === 'success' ? 'fa-solid fa-circle-check text-emerald-400 text-lg' : 'fa-solid fa-circle-info text-blue-400 text-lg';
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
    }
    window.showToast = showToast;
  </script>
</body>
