  <!-- 地圖切換按鈕 -->
  <select id="mapSelect" class="bg-slate-700 text-white text-sm rounded-lg px-3 py-1.5 border border-slate-600 focus:outline-none focus:border-amber-500 cursor-pointer">
    <option value="map-b2-b1">B2 / B1 區</option>
    <option value="map-l1-l5">L1 ~ L5 區</option>
  </select>
</div>

<!-- 中間：檢視模式切換 -->
<div class="flex bg-slate-700 rounded-lg p-1 border border-slate-600 text-xs sm:text-sm">
  <button id="btnMapView" class="px-3 py-1 rounded-md bg-amber-500 text-slate-950 font-semibold transition">🗺️ 地圖</button>
  <button id="btnListView" class="px-3 py-1 rounded-md text-slate-300 hover:text-white transition">📋 列表</button>
</div>

<!-- 右側：身分與導出按鈕 -->
<div class="flex items-center space-x-2">
  <button id="btnExportCsv" class="hidden sm:flex items-center bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1.5 rounded border border-emerald-500 transition">
    <i class="fa-solid fa-file-csv mr-1"></i> 匯出
  </button>
  <button id="btnLogin" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-lg border border-amber-400 transition cursor-pointer">
    <i class="fa-solid fa-user-lock mr-1"></i> <span id="userRoleText">訪客 (唯讀)</span>
  </button>
</div>


<!-- 列表檢視 -->
<div id="listViewContainer" class="hidden w-full h-full p-4 overflow-y-auto bg-slate-900">
  <div class="max-w-6xl mx-auto space-y-4">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-slate-800 p-3 rounded-lg border border-slate-700">
      <div class="flex items-center space-x-2 w-full sm:w-auto">
        <span class="text-xs text-slate-400">狀態：</span>
        <select id="filterStatus" class="bg-slate-700 text-white text-xs rounded px-2 py-1 border border-slate-600">
          <option value="all">全部狀態</option>
          <option value="unrestored">待修復 (紅)</option>
          <option value="restored">已修復 (綠)</option>
        </select>
      </div>
      <input type="text" id="searchKeyword" placeholder="搜尋標題、責任單位或描述..." class="bg-slate-700 text-white text-xs rounded px-3 py-1.5 border border-slate-600 w-full sm:w-64 focus:outline-none focus:border-amber-500">
    </div>

    <div class="bg-slate-800 rounded-lg border border-slate-700 overflow-x-auto">
      <table class="w-full text-left text-xs sm:text-sm text-slate-300">
        <thead class="bg-slate-700 text-slate-200 uppercase text-xs">
          <tr>
            <th class="p-3">狀態</th>
            <th class="p-3">圖資</th>
            <th class="p-3">損壞標題</th>
            <th class="p-3">責任單位</th>
            <th class="p-3">預計修復日</th>
            <th class="p-3">操作</th>
          </tr>
        </thead>
        <tbody id="pinTableBody" class="divide-y divide-slate-700">
          <!-- 動態渲染 -->
        </tbody>
      </table>
    </div>
  </div>
</div>


  <div class="space-y-4">
    <div>
      <label class="block text-xs font-semibold text-slate-400 mb-1">輸入權限密碼</label>
      <input type="password" id="inputAuthPassword" placeholder="預設：admin 或 superadmin" class="w-full bg-slate-700 rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500">
    </div>
    <div class="flex flex-col gap-2">
      <button id="btnSubmitAuth" class="w-full py-2 bg-amber-500 text-slate-950 font-bold rounded text-sm hover:bg-amber-400">解鎖驗證</button>
      <button id="btnResetGuest" class="w-full py-2 bg-slate-700 text-slate-300 rounded text-sm hover:bg-slate-600">切回訪客 (唯讀)</button>
    </div>
  </div>
</div>


  <form id="pinForm" class="space-y-4">
    <input type="hidden" id="formPinId">
    <input type="hidden" id="formMapId">
    <input type="hidden" id="formCoordX">
    <input type="hidden" id="formCoordY">

    <div>
      <label class="block text-xs font-semibold text-slate-400 mb-1">損壞標題 *</label>
      <input type="text" id="formTitle" required placeholder="例如：地坪破損、座椅鬆動" class="w-full bg-slate-700 rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500">
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">責任單位 (自由輸入)</label>
        <input type="text" id="formDept" placeholder="例如：工務維護" class="w-full bg-slate-700 rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-400 mb-1">預計修復日期</label>
        <input type="date" id="formRestoreDate" class="w-full bg-slate-700 rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500">
      </div>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-400 mb-1">實際修復日期 (有值代表已修復綠色)</label>
      <input type="date" id="formActualRestoreDate" class="w-full bg-slate-700 rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-400 mb-1">長描述內容</label>
      <textarea id="formDescription" rows="3" placeholder="詳細說明損壞情況與精確位置..." class="w-full bg-slate-700 rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500"></textarea>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-400 mb-1">修復方式</label>
      <input type="text" id="formRestoreMethod" placeholder="說明預計修復手段" class="w-full bg-slate-700 rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500">
    </div>

    <!-- 現場照片上傳 -->
    <div>
      <label class="block text-xs font-semibold text-slate-400 mb-1">現場照片 (最多 5 張)</label>
      <input type="file" id="formPhotoInput" multiple accept="image/*" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer">
      <div id="photoPreviewArea" class="flex flex-wrap gap-2 mt-2"></div>
    </div>

    <div class="pt-2 flex justify-end space-x-2">
      <button type="button" id="btnCancelModal" class="px-4 py-2 bg-slate-700 text-slate-300 rounded text-sm hover:bg-slate-600">取消</button>
      <button type="submit" id="btnSavePin" class="px-4 py-2 bg-amber-500 text-slate-950 font-semibold rounded text-sm hover:bg-amber-400">儲存資料</button>
    </div>
  </form>
</div>
