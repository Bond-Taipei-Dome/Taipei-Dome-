<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>臺北大巨蛋巡檢系統 V2 (Taipei Dome Inspection V2)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Swiper.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // 1. Supabase 雲端專案正式設定
    const SUPABASE_URL = 'https://pmwnnkemklbeuzupdvlq.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_XFUvaEUIqj8KKmVAgjpMqA_XpEyI1';

    // 2. 地圖圖資設定 (臺北大巨蛋高畫質 GitHub Raw 連結)
    window.maps = [
      {
        id: 'map-b2-b1',
        name: 'B2 / B1 區',
        url: 'https://raw.githubusercontent.com/Bond-Taipei-Dome/TaipeiDome-maps/main/taipeidome-map-b2%26b1.jpg'
      },
      {
        id: 'map-l1-l5',
        name: 'L1 ~ L5 區',
        url: 'https://raw.githubusercontent.com/Bond-Taipei-Dome/TaipeiDome-maps/main/taipeidome-map-L1toL5.jpg'
      }
    ];

    window.openLoginModal = function() {
      const modal = document.getElementById('loginModal');
      if (modal) modal.classList.remove('hidden');
    };

    window.closeModal = function(id) {
      const modal = document.getElementById(id);
      if (modal) modal.classList.add('hidden');
    };

    window.onMapLoaded = function() {
      if (typeof window.resetMapView === 'function') window.resetMapView();
      if (typeof window.renderPins === 'function') window.renderPins();
    };

    let supabaseClient = null;
    let isSupabaseConfigured = false;

    if (SUPABASE_URL && SUPABASE_ANON_KEY) {
      try {
        if (window.supabase) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          isSupabaseConfigured = true;
        }
      } catch (e) {
        console.warn("Supabase init notice:", e);
      }
    }

    const defaultDemoPins = [
      {
        id: 'demo-pin-1',
        mapId: 'map-b2-b1',
        x: 48.5,
        y: 42.0,
        title: 'B2 專有區消防栓標註檢查',
        department: '機電營修組',
        restoreDate: '2026-05-20',
        actualRestoreDate: null,
        restoreMethod: '進行壓力測試與閥門排氣作業',
        description: '現場巡檢確認圖冊對應位置，點位已與 4K 高畫質圖面精準對齊。',
        status: 'PENDING',
        images: ['https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=800&auto=format&fit=crop'],
        createdDate: '2026-11-02'
      }
    ];

    const localSaved = localStorage.getItem('taipei_dome_pins_v2');
    window.pins = localSaved ? JSON.parse(localSaved) : defaultDemoPins;
    window.currentMapId = 'map-b2-b1';
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 未修復 (紅色) 動態脈衝效果 */
    @keyframes pulse-ring-red {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pin-pulse-red { animation: pulse-ring-red 2s infinite ease-in-out; }

    /* 已修復 (綠色) 脈衝效果 */
    @keyframes pulse-ring-green {
      0% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.6; }
    }
    .pin-pulse-green { animation: pulse-ring-green 2.5s infinite ease-in-out; }

    .swiper-slide img { width: 100%; height: 260px; object-fit: cover; border-radius: 0.75rem; }

    /* 60fps 平移縮放優化 */
    #mapContainer {
      will-change: transform;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-800/95 backdrop-blur border-b border-slate-700 px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-lg">
    <div class="flex items-center space-x-2.5">
      <div class="bg-gradient-to-tr from-amber-500 to-amber-600 p-2 rounded-xl shadow-md">
        <i class="fa-solid fa-building-circle-check text-slate-950 text-base"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm md:text-base leading-tight">臺北大巨蛋巡檢系統 <span class="text-xs font-semibold px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-400 border border-amber-500/30">V2</span></h1>
        <p class="text-[11px] text-slate-400" id="roleBadge">
          <span class="inline-block w-2 h-2 rounded-full bg-blue-400 mr-1.5 animate-pulse"></span>訪客模式 (唯讀)
        </p>
      </div>
    </div>

    <!-- 地圖切換與檢視模式按鈕 -->
    <div class="flex items-center space-x-3">
      <!-- 地圖切換下拉選單 -->
      <select id="mapSelect" onchange="switchMap(this.value)" class="bg-slate-700 text-white text-xs sm:text-sm rounded-lg px-3 py-1.5 border border-slate-600 focus:outline-none focus:border-amber-500 cursor-pointer">
        <option value="map-b2-b1">B2 / B1 區</option>
        <option value="map-l1-l5">L1 ~ L5 區</option>
      </select>

      <!-- 中間：檢視模式切換 -->
      <div class="flex bg-slate-700 rounded-lg p-1 border border-slate-600 text-xs sm:text-sm">
        <button id="btnMapView" onclick="toggleView('map')" class="px-3 py-1 rounded-md bg-amber-500 text-slate-950 font-semibold transition">🗺️ 地圖</button>
        <button id="btnListView" onclick="toggleView('list')" class="px-3 py-1 rounded-md text-slate-300 hover:text-white transition">📋 列表</button>
      </div>

      <!-- 右側：匯出與驗證解鎖按鈕 -->
      <div class="flex items-center space-x-2">
        <button id="btnExportCsv" onclick="exportPinsToCSV()" class="flex items-center bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1.5 rounded border border-emerald-500 transition">
          <i class="fa-solid fa-file-csv mr-1"></i> 匯出
        </button>
        <button id="btnLogin" onclick="openLoginModal()" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-semibold text-xs sm:text-sm px-3 py-1.5 rounded-lg border border-amber-400 transition cursor-pointer flex items-center">
          <i class="fa-solid fa-user-lock mr-1"></i> <span id="userRoleText">訪客 (唯讀)</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 未設定 Supabase 警告提示標籤 -->
  <div id="supabaseWarningBanner" class="bg-amber-500/10 border-b border-amber-500/20 px-4 py-2 flex justify-between items-center text-xs text-amber-300">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-triangle-exclamation text-amber-400 text-sm"></i>
      <span>雲端即時連線防護啟用中。若連線失敗將自動開啟本地快取模式。</span>
    </div>
    <button onclick="document.getElementById('supabaseWarningBanner').remove()" class="text-amber-400/80 hover:text-amber-300"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <!-- 主互動地圖視窗 (MapView) -->
  <main class="relative flex-1 w-full bg-slate-950 overflow-hidden flex items-center justify-center min-h-[550px]" id="viewport">
    <div id="addPinTip" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 px-4 py-1.5 rounded-full text-xs font-bold shadow-2xl z-30 pointer-events-none flex items-center animate-bounce">
      <i class="fa-solid fa-crosshairs mr-1.5"></i>點擊地圖任意位置以記錄損壞點位
    </div>

    <div id="mapContainer" class="relative inline-block transition-transform duration-75 ease-out cursor-grab active:cursor-grabbing select-none" style="transform-origin: 0 0;">
      <img id="mapImage" src="https://raw.githubusercontent.com/Bond-Taipei-Dome/TaipeiDome-maps/main/taipeidome-map-b2%26b1.jpg" alt="台北大巨蛋平面圖" class="max-w-none block shadow-2xl rounded" onload="window.onMapLoaded()" onerror="this.src='https://placehold.co/2400x1400/1e293b/cbd5e1?text=Map+Loading+Error'">
      <div id="pinsLayer" class="absolute inset-0"></div>
    </div>

    <div class="absolute bottom-6 right-4 flex flex-col space-y-2 z-30">
      <button onclick="zoomMap(1.2)" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-xl border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-plus text-sm"></i>
      </button>
      <button onclick="zoomMap(0.8)" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-xl border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-minus text-sm"></i>
      </button>
      <button onclick="resetMapView()" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-xl border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-compress text-sm"></i>
      </button>
    </div>
  </main>

  <!-- 列表檢視視窗 (ListViewContainer) -->
  <div id="listViewContainer" class="hidden w-full flex-1 p-4 overflow-y-auto bg-slate-900">
    <div class="max-w-6xl mx-auto space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 bg-slate-800 p-3 rounded-lg border border-slate-700">
        <div class="flex items-center space-x-2 w-full sm:w-auto">
          <span class="text-xs text-slate-400">狀態：</span>
          <select id="filterStatus" onchange="renderListView()" class="bg-slate-700 text-white text-xs rounded px-2 py-1 border border-slate-600">
            <option value="all">全部狀態</option>
            <option value="unrestored">待修復 (紅)</option>

          </select>
        </div>
        <input type="text" id="searchKeyword" oninput="renderListView()" placeholder="搜尋標題、責任單位或描述..." class="bg-slate-700 text-white text-xs rounded px-3 py-1.5 border border-slate-600 w-full sm:w-64 focus:outline-none focus:border-amber-500">
      </div>

      <div class="bg-slate-800 rounded-lg border border-slate-700 overflow-x-auto">
        <table class="w-full text-left text-xs sm:text-sm text-slate-300">
          <thead class="bg-slate-700 text-slate-200 uppercase text-xs">
            <tr>
              <th class="p-3">狀態</th>
              <th class="p-3">圖資區域</th>
              <th class="p-3">損壞標題</th>
              <th class="p-3">責任單位</th>
              <th class="p-3">預計修復日</th>
              <th class="p-3">操作</th>

  <!-- 登入驗證 Modal -->

      <button onclick="closeModal('loginModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      <div class="flex items-center space-x-2.5 mb-3">
        <div class="bg-amber-500/20 text-amber-400 p-2 rounded-xl"><i class="fa-solid fa-shield-halved text-lg"></i></div>
        <h3 class="text-base font-bold text-white">身分權限解鎖</h3>
      </div>
      <p class="text-xs text-slate-400 mb-4">請輸入授權密碼以切換為管理員身分：</p>
      
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">輸入權限密碼</label>

          <button id="btnSubmitAuth" onclick="submitAuthPassword()" class="w-full py-2 bg-amber-500 text-slate-950 font-bold rounded text-sm hover:bg-amber-400 transition">解鎖驗證</button>
          <button id="btnResetGuest" onclick="resetToGuestRole()" class="w-full py-2 bg-slate-700 text-slate-300 rounded text-sm hover:bg-slate-600 transition">切回訪客 (唯讀)</button>
        </div>
      </div>

  <!-- 新增/編輯點位 Modal -->
  <div id="pinEditModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/90">
        <h3 id="pinModalTitle" class="font-bold text-white text-base">新增損壞紀錄</h3>
        <button onclick="closeModal('pinEditModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="pinForm" onsubmit="handleSavePin(event)" class="p-5 overflow-y-auto space-y-4 text-sm flex-1">

        <input type="hidden" id="formMapId">

        <input type="hidden" id="formCoordY">

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">損壞標題 *</label>
          <input type="text" id="formTitle" required placeholder="例如：地坪破損、座椅鬆動" class="w-full bg-slate-700 text-white rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">責任單位 (自由輸入)</label>
            <input type="text" id="formDept" required placeholder="例如：工務維護" class="w-full bg-slate-700 text-white rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">預計修復日期</label>
            <input type="date" id="formRestoreDate" class="w-full bg-slate-700 text-white rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">實際修復日期 (有值代表已修復綠色)</label>
          <input type="date" id="formActualRestoreDate" class="w-full bg-slate-700 text-white rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">長描述內容</label>
          <textarea id="formDescription" rows="3" placeholder="詳細說明損壞情況與精確位置..." class="w-full bg-slate-700 text-white rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500"></textarea>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">修復方式</label>
          <input type="text" id="formRestoreMethod" placeholder="說明預計修復手段" class="w-full bg-slate-700 text-white rounded p-2 text-sm border border-slate-600 focus:outline-none focus:border-amber-500">
        </div>

        <!-- 現場照片上傳 -->
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">現場照片 (最多 5 張)</label>
          <input type="file" id="formPhotoInput" multiple accept="image/*" onchange="onImagesSelected(event)" class="w-full text-xs text-slate-400 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:bg-amber-500 file:text-slate-950 hover:file:bg-amber-400 cursor-pointer">
          <div id="photoPreviewArea" class="flex flex-wrap gap-2 mt-2"></div>
        </div>

        <div class="pt-2 flex justify-end space-x-2 border-t border-slate-700">
          <button type="button" id="btnCancelModal" onclick="closeModal('pinEditModal')" class="px-4 py-2 bg-slate-700 text-slate-300 rounded text-sm hover:bg-slate-600 transition">取消</button>
          <button type="submit" id="btnSavePin" class="px-4 py-2 bg-amber-500 text-slate-950 font-semibold rounded text-sm hover:bg-amber-400 transition flex items-center">
            <span>儲存資料</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript 功能更新：匯出 CSV、列表模式切換與 Supabase 邏輯修復 -->
  <script>
    let pendingImageFiles = [];
    let currentUploadedImageUrls = [];
    let viewingPinId = null;
    let currentView = 'map'; // 'map' 或 'list'
    const ROLES = { VISITOR: 'VISITOR', ADMIN: 'ADMIN', SUPERADMIN: 'SUPERADMIN' };
    let currentRole = ROLES.VISITOR;

    // 平移與縮放全域變數
    let scale = 1, panX = 0, panY = 0, isDragging = false;
    let startX = 0, startY = 0;
    let isTransformPending = false;
    let viewport, container, mapImg;

    window.addEventListener('DOMContentLoaded', () => {
      viewport = document.getElementById('viewport');
      container = document.getElementById('mapContainer');
      mapImg = document.getElementById('mapImage');

      switchMap('map-b2-b1');
      setupInteractions();
      fetchPinsFromSupabase();
    });

    function switchMap(mapId) {
      window.currentMapId = mapId;
      const targetMap = window.maps.find(m => m.id === mapId) || window.maps[0];
      const img = document.getElementById('mapImage');
      if (img && targetMap) {
        img.src = targetMap.url;
      }
      const select = document.getElementById('mapSelect');
      if (select) select.value = mapId;
      
      resetMapView();
      renderPins();
    }

    function renderPins() {
      const layer = document.getElementById('pinsLayer');
      if (!layer) return;
      layer.innerHTML = '';
      if (!window.currentMapId) return;

      const list = (window.pins || []).filter(p => p.mapId === window.currentMapId);
      list.forEach(pin => {
        const isRepaired = !!pin.actualRestoreDate;
        const pulseClass = isRepaired ? 'pin-pulse-green bg-emerald-500/40' : 'pin-pulse-red bg-rose-500/40';
        const bgGradient = isRepaired ? 'from-emerald-600 to-teal-500' : 'from-rose-600 to-red-500';

        const el = document.createElement('div');
        el.className = 'absolute z-20 cursor-pointer group -translate-x-1/2 -translate-y-full';
        el.style.left = `${pin.x}%`;
        el.style.top = `${pin.y}%`;

        el.innerHTML = `
          <div class="relative flex flex-col items-center">
            <div class="absolute -inset-2 rounded-full ${pulseClass} pointer-events-none"></div>
            <div class="relative bg-gradient-to-tr ${bgGradient} text-white w-8 h-8 rounded-full shadow-2xl border-2 border-white flex items-center justify-center transition-transform group-hover:scale-125">
              <i class="fa-solid fa-location-dot text-xs drop-shadow"></i>
            </div>
            <div class="mt-1 whitespace-nowrap bg-slate-900/95 text-white text-[11px] font-bold px-2 py-0.5 rounded-md shadow-xl border border-slate-700 pointer-events-none">
              ${pin.title}
            </div>
          </div>
        `;
        el.onclick = (e) => { e.stopPropagation(); openPinViewModal(pin.id); };
        layer.appendChild(el);
      });
    }

    function setupInteractions() {
      if (!viewport || !container) return;
      let isMoved = false;

      const startPan = (cx, cy) => {
        isDragging = true;
        isMoved = false;
        startX = cx - panX;
        startY = cy - panY;
      };

      const movePan = (cx, cy) => {
        if (!isDragging) return;
        const nextPanX = cx - startX;
        const nextPanY = cy - startY;

        if (Math.abs(nextPanX - panX) > 2 || Math.abs(nextPanY - panY) > 2) {
          isMoved = true;
        }

        panX = nextPanX;
        panY = nextPanY;
        requestUpdateTransform();
      };

      const endPan = () => { isDragging = false; };

      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        startPan(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) movePan(e.clientX, e.clientY);
      });

      window.addEventListener('mouseup', endPan);

      container.onclick = (e) => {
        if (isMoved || currentRole === ROLES.VISITOR) {
          if (currentRole === ROLES.VISITOR && !isMoved) {
            showToast('請先切換至管理員身分以新增點位', 'info');
          }
          return;
        }
        const rect = container.getBoundingClientRect();
        const px = (((e.clientX - rect.left) / rect.width) * 100).toFixed(1);
        const py = (((e.clientY - rect.top) / rect.height) * 100).toFixed(1);
        openAddPinModal(px, py);
      };

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.12 : 0.88;
        zoomMap(zoomFactor);
      }, { passive: false });
    }

    function requestUpdateTransform() {
      if (!isTransformPending && container) {
        isTransformPending = true;
        requestAnimationFrame(() => {
          container.style.transform = `translate3d(${panX}px, ${panY}px, 0px) scale(${scale})`;
          isTransformPending = false;
        });
      }
    }

    function zoomMap(f) {
      scale = Math.min(Math.max(0.4, scale * f), 5);
      requestUpdateTransform();
    }

    function resetMapView() {
      scale = 1;
      panX = 0;
      panY = 0;
      requestUpdateTransform();
    }

    // 掛載至全域
    window.switchMap = switchMap;
    window.renderPins = renderPins;
    window.zoomMap = zoomMap;
    window.resetMapView = resetMapView;
