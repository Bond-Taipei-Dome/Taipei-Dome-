<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>臺北大巨蛋場務管理系統 v2026.11.06</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      background-color: #090d16;
    }

    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: brightness(0) invert(1);
      cursor: pointer;
      opacity: 0.9;
      transform: scale(1.2);
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    .touch-target {
      min-width: 44px;
      min-height: 44px;
    }

    .custom-pin {
      position: absolute;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 16px;
      border: 3px solid #ffffff;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.7);
      cursor: pointer;
      user-select: none;
      transform: translate(-50%, -50%) scale(var(--inv-scale, 1));
      transform-origin: center center;
      transition: transform 0.2s, box-shadow 0.2s;
      z-index: 10;
    }
    .custom-pin:hover {
      z-index: 40;
      transform: translate(-50%, -50%) scale(calc(var(--inv-scale, 1) * 1.25));
      box-shadow: 0 0 22px rgba(245, 158, 11, 0.9);
      border-color: #fde68a;
    }

    .pin-unrestored {
      background: radial-gradient(circle at 30% 30%, #f87171, #dc2626);
      animation: pulse-red 2.2s infinite;
    }
    .pin-restored {
      background: radial-gradient(circle at 30% 30%, #34d399, #059669);
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.75), 0 4px 10px rgba(0,0,0,0.5); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0), 0 4px 10px rgba(0,0,0,0.5); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0), 0 4px 10px rgba(0,0,0,0.5); }
    }

    #toastContainer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast-item { pointer-events: auto; }

    /* 《附件二十四》Word 檔標準 A4 官方報表列印防超頁與防拆分控制 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 10mm;
      }
      body, html {
        height: auto !important;
        overflow: visible !important;
        background-color: #ffffff !important;
        color: #000000 !important;
      }
      header, #viewport, #toastContainer, .no-print,
      #loginModal, #pinModal, #projectHeaderModal, #listViewContainer, #confirmModal {
        display: none !important;
      }
      #appendix24PrintArea {
        display: block !important;
        position: static !important;
        width: 100% !important;
        background: #ffffff !important;
        color: #000000 !important;
        padding: 0 !important;
      }
      .print-keep-together {
        break-inside: avoid !important;
        page-break-inside: avoid !important;
      }
      .print-img-limit {
        max-height: 22mm !important;
        object-fit: contain !important;
      }
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen select-none">

  <!-- Toast 提示容器 -->
  <div id="toastContainer"></div>

  <!-- 頂部導覽列 -->
  <header class="h-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 flex items-center justify-between px-3 sm:px-6 z-30 shrink-0 shadow-md">
    <!-- 左側：標誌與樓層剖面選單 -->
    <div class="flex items-center space-x-3 sm:space-x-4">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-tr from-emerald-500 via-teal-500 to-blue-600 flex items-center justify-center text-white shadow-inner shrink-0">
        <i class="fa-solid fa-stadium text-2xl"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-base sm:text-lg tracking-wide text-white leading-tight">臺北大巨蛋場務管理系統</h1>
          <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">v2026.11.06</span>
          <!-- 恆久雲端連線狀態標籤 -->
          <span id="cloudStatusBadge" class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 shadow">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span class="hidden sm:inline">🟢 雲端即時連線</span>
          </span>
        </div>
        <p id="headerActiveProjectText" class="text-xs text-amber-400/90 truncate max-w-[180px] sm:max-w-xs mt-0.5 font-medium">
          <i class="fa-solid fa-file-signature mr-1"></i>當前檔期：未設定
        </p>
      </div>

      <!-- 13 大獨立樓層與剖面圖選擇下拉選單 -->
      <div class="relative ml-2">
        <select id="mapSelect" onchange="switchMap(this.value)" class="bg-slate-800 hover:bg-slate-750 text-amber-400 font-bold text-xs sm:text-sm rounded-lg pl-3 pr-8 py-2.5 border border-slate-700 focus:outline-none focus:border-amber-500 cursor-pointer transition appearance-none min-h-[44px]">
          <optgroup label="🏢 樓層平面圖 (Floor Plans)">
            <option value="map-b2">B2 層平面圖</option>
            <option value="map-b1">B1 層平面圖</option>
            <option value="map-l1">L1 層平面圖</option>
            <option value="map-l2">L2 層平面圖</option>
            <option value="map-l3">L3 層平面圖</option>
            <option value="map-l4">L4 層平面圖</option>
            <option value="map-l5">L5 層平面圖</option>
            <option value="map-l6">L6 層平面圖</option>
            <option value="map-rf">RF 屋頂層平面圖</option>
          </optgroup>
          <optgroup label="📐 剖面立面圖 (Section Views)">
            <option value="map-sec-north">北向剖面圖</option>
            <option value="map-sec-south">南向剖面圖</option>
            <option value="map-sec-east">東向剖面圖</option>
            <option value="map-sec-west">西向剖面圖</option>
          </optgroup>
        </select>
        <i class="fa-solid fa-chevron-down text-[10px] text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
      </div>
    </div>

    <!-- 中間：視圖切換 (地圖 / 清單) -->
    <div class="flex items-center space-x-3">
      <div class="flex bg-slate-800 rounded-lg p-1 border border-slate-700 text-sm">
        <button id="btnMapView" onclick="switchMainView('map')" class="px-3.5 sm:px-4 py-2 rounded-md bg-amber-500 text-slate-950 font-bold transition flex items-center gap-1.5 shadow min-h-[44px]">
          <i class="fa-solid fa-map"></i> <span class="hidden sm:inline">地圖模式</span>
        </button>
        <button id="btnListView" onclick="switchMainView('list')" class="px-3.5 sm:px-4 py-2 rounded-md text-slate-300 hover:text-white transition flex items-center gap-1.5 min-h-[44px]">
          <i class="fa-solid fa-table-list"></i> <span class="hidden sm:inline">案件清單</span>
          <span id="totalBadge" class="bg-slate-700 text-amber-400 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
      </div>
    </div>

    <!-- 右側：功能按鈕群 -->
    <div class="flex items-center space-x-2">
      <button onclick="copyPendingListSummary()" class="flex items-center bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs sm:text-sm px-3.5 py-2.5 rounded-lg transition shadow-sm min-h-[44px]" title="一鍵複製待修復案件通報文字（可貼至 LINE）">
        <i class="fa-solid fa-share-nodes mr-1.5"></i> <span class="hidden lg:inline">通報分享</span>
      </button>

      <button onclick="openProjectHeaderManager()" class="flex items-center bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs sm:text-sm px-3.5 py-2.5 rounded-lg transition shadow-sm min-h-[44px]" title="管理與切換多筆活動檔期抬頭">
        <i class="fa-solid fa-folder-tree mr-1.5"></i> <span class="hidden md:inline">檔期抬頭</span>
      </button>

      <button onclick="exportAppendix24ModeA()" class="flex items-center bg-amber-600 hover:bg-amber-500 text-white font-bold text-xs sm:text-sm px-3.5 py-2.5 rounded-lg transition shadow-sm min-h-[44px]" title="匯出附件二十四 A4 紙本報表">
        <i class="fa-solid fa-file-export mr-1.5"></i> <span class="hidden md:inline">附件二十四</span>
      </button>

      <button id="btnLogin" onclick="openModal('loginModal')" class="flex items-center bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold text-xs sm:text-sm px-3.5 py-2.5 rounded-lg border border-slate-700 transition min-h-[44px]">
        <i class="fa-solid fa-shield-halved mr-1.5 text-amber-400"></i>
        <span id="userRoleText">訪客</span>
      </button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-1 relative overflow-hidden flex flex-col">

    <!-- 1. 地圖視窗 -->
    <div id="viewport" class="w-full h-full relative overflow-hidden bg-slate-950 touch-none cursor-grab active:cursor-grabbing">
      
      <div class="absolute top-3 left-3 z-20 pointer-events-none flex items-center gap-2">
        <div id="mapHintBanner" class="bg-slate-900/90 backdrop-blur-md border border-slate-700/80 text-slate-100 px-3.5 py-2 rounded-lg text-xs sm:text-sm flex items-center gap-2 shadow-lg">
          <i class="fa-solid fa-circle-info text-amber-400"></i>
          <span id="mapActionHint">點擊圖面任意位置可新增損壞巡檢點位</span>
        </div>
      </div>

      <div id="mapLoadingOverlay" class="absolute inset-0 z-20 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-sm font-bold text-amber-400">正在同步雲端資料與載入最新高畫質圖資...</p>
      </div>

      <div id="mapStage" class="absolute top-0 left-0 origin-top-left will-change-transform select-none">
        <div id="mapWrapper" class="relative inline-block">
          <img id="mapImage" src="" alt="臺北大巨蛋巡檢平面/剖面圖" class="block max-w-none select-none pointer-events-none" onload="onMapLoaded()" onerror="onMapError()">
          <div id="pinLayer" class="absolute inset-0 pointer-events-auto"></div>
        </div>
      </div>

      <!-- 地圖縮放與圖例按鈕 -->
      <div class="absolute bottom-5 right-5 z-20 flex flex-col gap-2.5">
        <div class="bg-slate-900/90 backdrop-blur border border-slate-700 rounded-xl p-3 text-xs sm:text-sm space-y-2 shadow-xl">
          <div class="flex items-center justify-between gap-4">
            <span class="flex items-center gap-2 text-slate-200 font-medium"><span class="w-3.5 h-3.5 rounded-full bg-rose-500 inline-block border border-white"></span> 待修復</span>
            <strong id="legendPending" class="text-rose-400 text-base">0</strong>
          </div>
          <div class="flex items-center justify-between gap-4">
            <span class="flex items-center gap-2 text-slate-200 font-medium"><span class="w-3.5 h-3.5 rounded-full bg-emerald-500 inline-block border border-white"></span> 已修復</span>
            <strong id="legendCompleted" class="text-emerald-400 text-base">0</strong>
          </div>
          <div class="pt-2 border-t border-slate-700/80">
            <label class="flex items-center gap-2 cursor-pointer text-xs text-amber-300 font-semibold select-none hover:text-amber-200 transition">
              <input type="checkbox" id="toggleHideRestored" onchange="toggleHideRestoredPins(this.checked)" class="w-4 h-4 accent-amber-500 rounded cursor-pointer">
              <span>僅顯示待修紅點</span>
            </label>
          </div>
        </div>

        <div class="bg-slate-900/90 backdrop-blur border border-slate-700 rounded-xl overflow-hidden flex flex-col shadow-xl">
          <button onclick="zoomMap(1.25)" class="touch-target hover:bg-slate-800 text-slate-200 hover:text-amber-400 transition border-b border-slate-800 text-lg flex items-center justify-center" title="放大">
            <i class="fa-solid fa-magnifying-glass-plus"></i>
          </button>
          <div id="zoomLevelText" class="text-xs font-mono text-center py-1 bg-slate-950/60 text-amber-400 font-bold">100%</div>
          <button onclick="zoomMap(0.8)" class="touch-target hover:bg-slate-800 text-slate-200 hover:text-amber-400 transition border-t border-b border-slate-800 text-lg flex items-center justify-center" title="縮小">
            <i class="fa-solid fa-magnifying-glass-minus"></i>
          </button>
          <button onclick="fitMapToScreen()" class="touch-target hover:bg-slate-800 text-slate-200 hover:text-amber-400 transition text-lg flex items-center justify-center" title="適應螢幕">
            <i class="fa-solid fa-expand"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 2. 列表視窗 -->
    <div id="listViewContainer" class="hidden w-full h-full p-4 sm:p-6 overflow-y-auto bg-slate-900 select-text">
      <div class="max-w-7xl mx-auto space-y-4">
        <div class="flex flex-col sm:flex-row justify-between items-stretch sm:items-center gap-3 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
          <div class="flex flex-wrap items-center gap-3">
            <select id="filterMap" onchange="renderListViewTable()" class="bg-slate-700 text-white text-xs sm:text-sm rounded-lg px-3.5 py-2.5 border border-slate-600 focus:outline-none focus:border-amber-500 min-h-[44px]">
              <option value="all">全部樓層與剖面圖</option>
              <optgroup label="樓層平面圖">
                <option value="map-b2">B2 層</option>
                <option value="map-b1">B1 層</option>
                <option value="map-l1">L1 層</option>
                <option value="map-l2">L2 層</option>
                <option value="map-l3">L3 層</option>
                <option value="map-l4">L4 層</option>
                <option value="map-l5">L5 層</option>
                <option value="map-l6">L6 層</option>
                <option value="map-rf">RF 屋頂層</option>
              </optgroup>
              <optgroup label="剖面圖">
                <option value="map-sec-north">北向剖面</option>
                <option value="map-sec-south">南向剖面</option>
                <option value="map-sec-east">東向剖面</option>
                <option value="map-sec-west">西向剖面</option>
              </optgroup>
            </select>
            <select id="filterStatus" onchange="renderListViewTable()" class="bg-slate-700 text-white text-xs sm:text-sm rounded-lg px-3.5 py-2.5 border border-slate-600 focus:outline-none focus:border-amber-500 min-h-[44px]">
              <option value="all">全部狀態</option>
              <option value="unrestored">🔴 待修復案件</option>
              <option value="restored">🟢 已修復案件</option>
            </select>
            <button onclick="copyPendingListSummary()" class="bg-teal-600 hover:bg-teal-500 text-white font-bold text-xs sm:text-sm px-3.5 py-2.5 rounded-lg border border-teal-500 transition min-h-[44px] flex items-center gap-1.5 shadow">
              <i class="fa-solid fa-copy"></i> 一鍵複製待修清單
            </button>
          </div>
          <div class="relative flex-1 sm:w-72">
            <i class="fa-solid fa-magnifying-glass text-slate-400 text-xs absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="searchKeyword" oninput="renderListViewTable()" placeholder="搜尋標題、責任單位或活動抬頭..." class="bg-slate-700 text-white text-xs sm:text-sm rounded-lg pl-9 pr-3.5 py-2.5 border border-slate-600 w-full focus:outline-none focus:border-amber-500 min-h-[44px]">
          </div>
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs sm:text-sm text-slate-200">
              <thead class="bg-slate-700/80 text-slate-100 uppercase text-xs border-b border-slate-600">
                <tr>
                  <th class="py-3.5 px-4">狀態</th>
                  <th class="py-3.5 px-4">圖資區域</th>
                  <th class="py-3.5 px-4">活動抬頭與損壞標題</th>
                  <th class="py-3.5 px-4">責任單位</th>
                  <th class="py-3.5 px-4">修復方式</th>
                  <th class="py-3.5 px-4 text-right">操作</th>
                </tr>
              </thead>
              <tbody id="listViewTableBody" class="divide-y divide-slate-700/70">
                <!-- 動態渲染 -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- 彈窗 1：多筆專案抬頭管理 -->
  <div id="projectHeaderModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 rounded-2xl border border-indigo-500/50 max-w-2xl w-full p-6 text-slate-100 relative shadow-2xl max-h-[92vh] overflow-y-auto">
      <button onclick="closeModal('projectHeaderModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl p-2"><i class="fa-solid fa-xmark"></i></button>
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl shrink-0"><i class="fa-solid fa-folder-tree"></i></div>
        <div>
          <h2 class="text-xl font-bold text-white">多檔期專案抬頭與責任歸屬管理</h2>
          <p class="text-xs text-slate-300">建立與選擇不同活動檔期的租用抬頭，自動分類損害案件。</p>
        </div>
      </div>

      <div class="bg-slate-90
