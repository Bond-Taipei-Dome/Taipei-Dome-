<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>臺北大巨蛋巡檢系統 V2 (Taipei Dome Inspection V2)</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Swiper.js -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <!-- Supabase JS Client v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // 1. Supabase 雲端專案正式設定
    const SUPABASE_URL = 'https://pmwnnkemklbeuzupdvlq.supabase.co'; 
    const SUPABASE_ANON_KEY = 'sb_publishable_XFUvaEUIqj8KKmVAgjpMqA_XpEyI1';

    // 早期宣告全域 onMapLoaded 避開 inline onload 早於 JS 載入時觸發 ReferenceError
    window.onMapLoaded = function() {
      if (typeof window.resetMapView === 'function') window.resetMapView();
      if (typeof window.renderPins === 'function') window.renderPins();
    };

    let supabaseClient = null;
    let isSupabaseConfigured = false;

    // 啟動 Supabase Client 串接
    if (SUPABASE_URL && SUPABASE_ANON_KEY) {
      try {
        if (window.supabase) {
          supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
          isSupabaseConfigured = true;
        }
      } catch (e) {
        console.warn("Supabase init notice:", e);
      }
    }

    // 2. 地圖圖資設定
    window.maps = [
      {
        id: 'map-b2-b1',
        name: 'B2 / B1層 專有共用區分圖',
        url: 'https://raw.githubusercontent.com/Bond-Taipei-Dome/TaipeiDome-maps/main/taipeidome-map-b2%26b1.jpg'
      },
      {
        id: 'map-l1-l5',
        name: 'L1 ~ L5層 專有共用區分圖',
        url: 'https://raw.githubusercontent.com/Bond-Taipei-Dome/TaipeiDome-maps/main/taipeidome-map-L1toL5.jpg'
      }
    ];

    // 預設示範點位 (作為備份)
    const defaultDemoPins = [
      {
        id: 'demo-pin-1',
        mapId: 'map-b2-b1',
        x: 48.5,
        y: 42.0,
        title: 'B2 專有區消防栓標註檢查',
        department: '機電營修組',
        restoreDate: '2026-05-20',
        actualRestoreDate: null,
        restoreMethod: '進行壓力測試與閥門排氣作業',
        description: '現場巡檢確認圖冊對應位置，點位已與 4K 高畫質圖面精準對齊。',
        status: 'PENDING',
        images: ['https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=800&auto=format&fit=crop'],
        createdDate: '2026-11-02'
      }
    ];

    const localSaved = localStorage.getItem('taipei_dome_pins_v2');
    window.pins = localSaved ? JSON.parse(localSaved) : defaultDemoPins;
    window.currentMapId = 'map-b2-b1';
  </script>

  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 未修復 (紅色) 動態脈衝效果 */
    @keyframes pulse-ring-red {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.4); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pin-pulse-red { animation: pulse-ring-red 2s infinite ease-in-out; }

    /* 已修復 (綠色) 脈衝效果 */
    @keyframes pulse-ring-green {
      0% { transform: scale(0.95); opacity: 0.6; }
      50% { transform: scale(1.2); opacity: 0.2; }
      100% { transform: scale(0.95); opacity: 0.6; }
    }
    .pin-pulse-green { animation: pulse-ring-green 2.5s infinite ease-in-out; }

    .swiper-slide img { width: 100%; height: 260px; object-fit: cover; border-radius: 0.75rem; }

    /* 60fps 平移縮放優化 */
    #mapContainer {
      will-change: transform;
      transform-style: preserve-3d;
      backface-visibility: hidden;
      touch-action: none;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between overflow-x-hidden">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-800/95 backdrop-blur border-b border-slate-700 px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-lg">
    <div class="flex items-center space-x-2.5">
      <div class="bg-gradient-to-tr from-blue-600 to-indigo-600 p-2 rounded-xl shadow-md">
        <i class="fa-solid fa-building-circle-check text-white text-base"></i>
      </div>
      <div>
        <h1 class="font-bold text-sm md:text-base leading-tight">臺北大巨蛋巡檢系統 <span class="text-xs font-semibold px-1.5 py-0.5 rounded bg-blue-500/20 text-blue-400 border border-blue-500/30">V2</span></h1>
        <p class="text-[11px] text-slate-400" id="roleBadge">
          <span class="inline-block w-2 h-2 rounded-full bg-blue-400 mr-1.5 animate-pulse"></span>訪客模式 (唯讀)
        </p>
      </div>
    </div>

    <div class="flex items-center space-x-2">
      <button onclick="fetchPinsFromSupabase()" class="bg-slate-700/80 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center transition border border-slate-600">
        <i class="fa-solid fa-rotate mr-1.5 text-blue-400"></i>重新整理
      </button>
      <button onclick="openLoginModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-semibold shadow-md transition flex items-center">
        <i class="fa-solid fa-user-lock mr-1.5"></i>切換權限
      </button>
    </div>
  </header>

  <!-- 未設定 Supabase 警告提示標籤 -->
  <div id="supabaseWarningBanner" class="bg-amber-500/10 border-b border-amber-500/20 px-4 py-2 flex justify-between items-center text-xs text-amber-300">
    <div class="flex items-center space-x-2">
      <i class="fa-solid fa-triangle-exclamation text-amber-400 text-sm"></i>
      <span>目前運行於「本地離線模式」。請於程式碼 `index-v2.html` 填入正確的 Supabase URL 及 Key 以連線雲端資料庫。</span>
    </div>
    <button onclick="document.getElementById('supabaseWarningBanner').remove()" class="text-amber-400/80 hover:text-amber-300"><i class="fa-solid fa-xmark"></i></button>
  </div>

  <!-- 圖面切換頁籤 -->
  <nav class="bg-slate-800/80 border-b border-slate-700 px-4 py-2 flex items-center space-x-2 overflow-x-auto no-scrollbar z-30 shadow-inner">
    <span class="text-xs text-slate-400 shrink-0 font-semibold"><i class="fa-solid fa-layer-group mr-1.5 text-indigo-400"></i>區域圖資:</span>
    <div id="mapTabs" class="flex space-x-2"></div>
  </nav>

  <!-- 主互動地圖視窗 -->
  <main class="relative flex-1 w-full bg-slate-950 overflow-hidden flex items-center justify-center min-h-[550px]" id="viewport">
    <div id="addPinTip" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-amber-500 text-slate-950 px-4 py-1.5 rounded-full text-xs font-bold shadow-2xl z-30 pointer-events-none flex items-center animate-bounce">
      <i class="fa-solid fa-crosshairs mr-1.5"></i>點擊地圖任意位置以記錄損壞點位
    </div>

    <div id="mapContainer" class="relative inline-block transition-transform duration-75 ease-out cursor-grab active:cursor-grabbing select-none" style="transform-origin: 0 0;">
      <img id="mapImage" src="" alt="台北大巨蛋平面圖" class="max-w-none block shadow-2xl rounded" onload="onMapLoaded()" onerror="this.src='https://placehold.co/2400x1400/1e293b/cbd5e1?text=Map+Loading+Error'">
      <div id="pinsLayer" class="absolute inset-0"></div>
    </div>

    <!-- 縮放與控制按鈕 -->
    <div class="absolute bottom-6 right-4 flex flex-col space-y-2 z-30">
      <button onclick="zoomMap(1.2)" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-xl border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-plus text-sm"></i>
      </button>
      <button onclick="zoomMap(0.8)" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-xl border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-minus text-sm"></i>
      </button>
      <button onclick="resetMapView()" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-xl border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-compress text-sm"></i>
      </button>
    </div>
  </main>

  <!-- 登入驗證 Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl relative">
      <button onclick="closeModal('loginModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      <div class="flex items-center space-x-2.5 mb-3">
        <div class="bg-blue-600/20 text-blue-400 p-2 rounded-xl"><i class="fa-solid fa-shield-halved text-lg"></i></div>
        <h3 class="text-base font-bold text-white">身分權限解鎖</h3>
      </div>
      <p class="text-xs text-slate-400 mb-4">請輸入授權密碼以切換為管理員身分：</p>
      
      <form onsubmit="handleLoginSubmit(event)">
        <div class="mb-4">
          <input type="password" id="loginPassword" required placeholder="請輸入密碼" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
        </div>
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl shadow-lg text-xs transition">解鎖權限</button>
      </form>
    </div>
  </div>

  <!-- 新增/編輯點位 Modal -->
  <div id="pinEditModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="px-5 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/90">
        <h3 id="pinModalTitle" class="font-bold text-white text-base">新增損壞紀錄</h3>
        <button onclick="closeModal('pinEditModal')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="pinForm" onsubmit="handleSavePin(event)" class="p-5 overflow-y-auto space-y-4 text-sm flex-1">
        <input type="hidden" id="editPinId">
        <input type="hidden" id="editPinX">
        <input type="hidden" id="editPinY">

        <div>
          <label class="block text-xs text-slate-300 font-medium mb-1">事件 / 損壞名稱 <span class="text-rose-500">*</span></label>
          <input type="text" id="pinTitleInput" required placeholder="例如：地坪破損 / 欄杆鬆動 / 門片損壞" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-blue-500">
        </div>

        <div>
          <label class="block text-xs text-slate-300 font-medium mb-1">責任單位 <span class="text-rose-500">*</span> <span class="text-slate-400 font-normal">(自由輸入)</span></label>
          <input type="text" id="pinDeptInput" required placeholder="例如：機電營修組 / 營建處 / 廠商A" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-300 font-medium mb-1">預計復原日期</label>
            <input type="date" id="pinDateInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs text-slate-300 font-medium mb-1">實際復原日期 <span class="text-emerald-400 font-normal">(有值即標註為已修復)</span></label>
            <input type="date" id="pinActualDateInput" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-300 font-medium mb-1">處置方式說明</label>
          <textarea id="pinMethodInput" rows="2" placeholder="維修計畫與處置步驟..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <div>
          <label class="block text-xs text-slate-300 font-medium mb-1">詳細描述 <span class="text-slate-400 font-normal">(長描述)</span></label>
          <textarea id="pinDescInput" rows="3" placeholder="現況詳細補充說明..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <div>
          <label class="block text-xs text-slate-300 font-medium mb-1">現場照片 <span class="text-slate-400 font-normal">(最多 5 張，上傳至 Supabase Storage)</span></label>
          <input type="file" id="imageFileInput" accept="image/*" multiple onchange="onImagesSelected(event)" class="hidden">
          <button type="button" onclick="document.getElementById('imageFileInput').click()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3.5 py-2 rounded-xl text-xs font-medium border border-slate-600 transition flex items-center">
            <i class="fa-solid fa-camera mr-1.5 text-blue-400"></i>選擇 / 拍攝現場照片
          </button>
          <div id="imagePreviewStrip" class="flex space-x-2 overflow-x-auto py-2 mt-2"></div>
        </div>

        <div class="pt-3 flex justify-end space-x-2 border-t border-slate-700">
          <button type="button" onclick="closeModal('pinEditModal')" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-xl text-xs font-medium">取消</button>
          <button type="submit" id="savePinBtn" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-xs shadow-md flex items-center">
            <span>儲存點位</span>
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 點位詳細檢視 Modal -->
  <div id="pinViewModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
      <div class="p-4 border-b border-slate-700 flex justify-between items-start bg-slate-800/90">
        <div>
          <div class="flex items-center space-x-2 mb-1">
            <span id="viewStatusBadge" class="inline-block text-[11px] px-2.5 py-0.5 rounded-full font-bold"></span>
            <span id="viewDeptBadge" class="inline-block bg-blue-600/30 text-blue-300 border border-blue-500/30 text-[11px] px-2.5 py-0.5 rounded-full font-medium"></span>
          </div>
          <h3 id="viewTitleText" class="text-lg font-bold text-white"></h3>
        </div>
        <button onclick="closeModal('pinViewModal')" class="text-slate-400 hover:text-white p-1"><i class="fa-solid fa-xmark text-xl"></i></button>
      </div>

      <div class="p-5 overflow-y-auto space-y-4 text-xs sm:text-sm flex-1">
        <div id="swiperWrapperBox" class="swiper w-full rounded-xl overflow-hidden bg-slate-900 border border-slate-700">
          <div class="swiper-wrapper" id="viewPhotosContainer"></div>
          <div class="swiper-pagination"></div>
          <div class="swiper-button-next !text-white/80 scale-75"></div>
          <div class="swiper-button-prev !text-white/80 scale-75"></div>
        </div>

        <div class="grid grid-cols-2 gap-2 bg-slate-900/60 p-3 rounded-xl border border-slate-700">
          <div><span class="text-slate-400 text-[11px] block">預計復原日</span><span id="viewDateText" class="font-medium text-amber-400"></span></div>
          <div><span class="text-slate-400 text-[11px] block">實際復原日</span><span id="viewActualDateText" class="font-medium text-emerald-400"></span></div>
        </div>
        <div>
          <h4 class="text-slate-400 text-[11px] font-semibold uppercase tracking-wider mb-1">處置方式說明</h4>
          <p id="viewMethodText" class="text-slate-200 bg-slate-900/40 p-3 rounded-xl border border-slate-700/40 leading-relaxed"></p>
        </div>
        <div>
          <h4 class="text-slate-400 text-[11px] font-semibold uppercase tracking-wider mb-1">詳細描述</h4>
          <p id="viewDescText" class="text-slate-300 bg-slate-900/40 p-3 rounded-xl border border-slate-700/40 leading-relaxed"></p>
        </div>
      </div>

      <div class="p-4 border-t border-slate-700 bg-slate-800 flex justify-between items-center">
        <button id="deletePinBtn" onclick="deleteActivePin()" class="hidden text-rose-400 hover:bg-rose-500/20 px-3 py-2 rounded-xl text-xs font-semibold transition"><i class="fa-solid fa-trash-can mr-1.5"></i>刪除紀錄</button>
        <button id="editPinBtn" onclick="editActivePin()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-xs font-semibold ml-auto transition"><i class="fa-solid fa-pen-to-square mr-1.5"></i>編輯內容</button>
      </div>
    </div>
  </div>

  <!-- Toast 訊息 -->
  <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-700 text-white px-5 py-3 rounded-2xl shadow-2xl z-50 flex items-center space-x-3 transition-all duration-300 opacity-0 pointer-events-none">
    <i id="toastIcon" class="fa-solid fa-circle-info text-blue-400 text-lg"></i>
    <span id="toastMsg" class="text-xs font-medium"></span>
  </div>

  <script>
    // P1 & P2: 透過 Supabase JS SDK 讀取 Pins (含 Fail-Safe 降級機制)
    async function fetchPinsFromSupabase() {
      if (!isSupabaseConfigured || !supabaseClient) {
        console.warn("Supabase 未配置真實端點，使用本地點位資料庫。");
        renderPins();
        showToast('目前使用本地離線點位', 'info');
        return;
      }
      
      try {
        const { data, error } = await supabaseClient.from('pins').select('*');
        if (error) throw error;

        window.pins = (data || []).map(p => ({
          id: p.id,
          mapId: p.map_id,
          x: p.x,
          y: p.y,
          title: p.title,
          department: p.department,
          restoreDate: p.restore_date,
          actualRestoreDate: p.actual_restore_date,
          restoreMethod: p.restore_method,
          description: p.description,
          status: p.status,
          images: p.images || [],
          createdDate: p.created_at
        }));

        localStorage.setItem('taipei_dome_pins_v2', JSON.stringify(window.pins));
        renderPins();
        showToast('與 Supabase 雲端資料同步完成', 'success');
      } catch (err) {
        console.warn("Supabase 讀取失敗，自動退回本地快取:", err.message || err);
        renderPins();
        showToast('雲端連線失敗，自動載入本地資料', 'info');
      }
    }

    // P3 & P4: 渲染點位 (未修復: 紅色, 已修復: 綠色)
    function renderPins() {
      const layer = document.getElementById('pinsLayer');
      if (!layer) return;
      layer.innerHTML = '';
      if (!window.currentMapId) return;

      const list = (window.pins || []).filter(p => p.mapId === window.currentMapId);
      list.forEach(pin => {
        const isRepaired = !!pin.actualRestoreDate; // 條件: actual_restore_date 有值即為已修復
        
        const el = document.createElement('div');
        el.className = 'absolute z-20 cursor-pointer group -translate-x-1/2 -translate-y-full';
        el.style.left = `${pin.x}%`;
        el.style.top = `${pin.y}%`;

        // P4: 動態選擇顏色樣式 (紅色未修復 vs 綠色已修復)
        const pulseClass = isRepaired ? 'bg-emerald-500/40 pin-pulse-green' : 'bg-rose-500/40 pin-pulse-red';
        const badgeBg = isRepaired 
          ? 'bg-gradient-to-tr from-emerald-600 to-green-500' 
          : 'bg-gradient-to-tr from-rose-600 to-red-500';
        const iconClass = isRepaired ? 'fa-check' : 'fa-triangle-exclamation';

        el.innerHTML = `
          <div class="relative flex flex-col items-center">
            <div class="absolute -inset-2 rounded-full ${pulseClass} pointer-events-none"></div>
            <div class="relative ${badgeBg} text-white w-9 h-9 rounded-full shadow-2xl border-2 border-white flex items-center justify-center transition-transform group-hover:scale-125">
              <i class="fa-solid ${iconClass} text-sm drop-shadow"></i>
            </div>
            <div class="mt-1 whitespace-nowrap bg-slate-900/95 text-white text-[11px] font-bold px-2 py-0.5 rounded-md shadow-xl border border-slate-700 pointer-events-none">
              ${pin.title}
            </div>
          </div>
        `;
        el.onclick = (e) => { e.stopPropagation(); openPinViewModal(pin.id); };
        layer.appendChild(el);
      });
    }

    // P5: 照片上傳至 Supabase Storage (photos bucket)
    async function uploadImagesToStorage(files) {
      if (!isSupabaseConfigured || !supabaseClient) return [];
      const uploadedUrls = [];

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        const fileExt = file.name.split('.').pop() || 'jpg';
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 7)}.${fileExt}`;
        const filePath = `pin_photos/${fileName}`;

        try {
          const { error } = await supabaseClient.storage.from('photos').upload(filePath, file, {
            cacheControl: '3600',
            upsert: false
          });

          if (error) throw error;

          const { data: publicUrlData } = supabaseClient.storage.from('photos').getPublicUrl(filePath);
          if (publicUrlData?.publicUrl) {
            uploadedUrls.push(publicUrlData.publicUrl);
          }
        } catch (uploadErr) {
          console.error("Storage Upload Error:", uploadErr);
        }
      }
      return uploadedUrls;
    }

    async function handleSavePin(e) {
      e.preventDefault();
      const saveBtn = document.getElementById('savePinBtn');
      saveBtn.disabled = true;
      saveBtn.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-1.5"></i>儲存中...`;

      const id = document.getElementById('editPinId').value || `pin-${Date.now()}`;
      const title = document.getElementById('pinTitleInput').value.trim();
      const department = document.getElementById('pinDeptInput').value.trim();
      const restoreDate = document.getElementById('pinDateInput').value || null;
      const actualRestoreDate = document.getElementById('pinActualDateInput').value || null;
      const restoreMethod = document.getElementById('pinMethodInput').value.trim();
      const description = document.getElementById('pinDescInput').value.trim();
      const x = parseFloat(document.getElementById('editPinX').value);
      const y = parseFloat(document.getElementById('editPinY').value);

      // 上傳新選取的照片
      let newUploadedUrls = [];
      if (pendingImageFiles.length > 0 && isSupabaseConfigured) {
        newUploadedUrls = await uploadImagesToStorage(pendingImageFiles);
      }
      const finalImages = [...currentUploadedImageUrls, ...newUploadedUrls].slice(0, 5);

      const localPinObj = {
        id,
        mapId: window.currentMapId,
        x, y,
        title, department,
        restoreDate,
        actualRestoreDate,
        restoreMethod, description,
        status: actualRestoreDate ? 'COMPLETED' : 'PENDING',
        images: finalImages,
        createdDate: new Date().toISOString().split('T')[0]
      };

      // 1. 寫入本地存儲
      const existingIdx = window.pins.findIndex(p => p.id === id);
      if (existingIdx >= 0) window.pins[existingIdx] = localPinObj;
      else window.pins.push(localPinObj);
      localStorage.setItem('taipei_dome_pins_v2', JSON.stringify(window.pins));

      // 2. 若 Supabase 連線正常則發送至雲端
      if (isSupabaseConfigured && supabaseClient) {

      showToast('損壞紀錄儲存成功！', 'success');

    // 互動控制 Engine
    function setupInteractions() {
      if (!viewport || !container) return;
      let isMoved = false;

      const getTouchDistance = (e) => {
        const dx = e.touches[0].clientX - e.touches[1].clientX;
        const dy = e.touches[0].clientY - e.touches[1].clientY;
        return Math.hypot(dx, dy);
      };

      const startPan = (cx, cy) => {
        isDragging = true;
        isMoved = false;
        startX = cx - panX;
        startY = cy - panY;
      };

      const movePan = (cx, cy) => {
        if (!isDragging) return;
        const nextPanX = cx - startX;
        const nextPanY = cy - startY;

        if (Math.abs(nextPanX - panX) > 2 || Math.abs(nextPanY - panY) > 2) {
          isMoved = true;
        }

        panX = nextPanX;
        panY = nextPanY;
        requestUpdateTransform();
      };

      const endPan = () => {
        isDragging = false;
        initialTouchDistance = 0;
      };

      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        startPan(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) movePan(e.clientX, e.clientY);
      });

      window.addEventListener('mouseup', endPan);

      viewport.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          startPan(e.touches[0].clientX, e.touches[0].clientY);
        } else if (e.touches.length === 2) {
          isDragging = false;
          initialTouchDistance = getTouchDistance(e);
          initialScale = scale;
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isDragging) {
          movePan(e.touches[0].clientX, e.touches[0].clientY);
        } else if (e.touches.length === 2 && initialTouchDistance > 0) {
          const currentDistance = getTouchDistance(e);
          const zoomFactor = currentDistance / initialTouchDistance;
          scale = Math.min(Math.max(0.4, initialScale * zoomFactor), 5);
          requestUpdateTransform();
        }
      }, { passive: true });

      window.addEventListener('touchend', endPan);

      container.onclick = (e) => {
        if (isMoved || currentRole === ROLES.VISITOR) {
          if (currentRole === ROLES.VISITOR && !isMoved) {
            showToast('請先切換至管理員身分以標註損壞', 'info');
          }
          return;
        }
        const rect = container.getBoundingClientRect();
        const px = (((e.clientX - rect.left) / rect.width) * 100).toFixed(1);
        const py = (((e.clientY - rect.top) / rect.height) * 100).toFixed(1);
        openAddPinModal(px, py);
      };

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.12 : 0.88;
        zoomMap(zoomFactor);
      }, { passive: false });
    }

    function requestUpdateTransform() {
      if (!isTransformPending && container) {
        isTransformPending = true;
        requestAnimationFrame(() => {
          container.style.transform = `translate3d(${panX}px, ${panY}px, 0px) scale(${scale})`;
          isTransformPending = false;
        });
      }
    }

    function zoomMap(f) {
      scale = Math.min(Math.max(0.4, scale * f), 5);
      requestUpdateTransform();
    }

    function resetMapView() {
      scale = 1; panX = 0; panY = 0;
      requestUpdateTransform();
    }

    function closeModal(id) {
      const el = document.getElementById(id);
      if (el) el.classList.add('hidden');
    }

    function openLoginModal() {
      document.getElementById('loginModal').classList.remove('hidden');
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      if (!toast) return;
      document.getElementById('toastMsg').innerText = msg;
      const icon = document.getElementById('toastIcon');
      icon.className = type === 'success' ? 'fa-solid fa-circle-check text-emerald-400 text-lg' : 'fa-solid fa-circle-info text-blue-400 text-lg';
      toast.classList.remove('opacity-0', 'pointer-events-none');
      setTimeout(() => toast.classList.add('opacity-0', 'pointer-events-none'), 3000);
    }

    // 將所有 HTML 事件處理函式掛載至全域 window，徹底防止 ReferenceError
    window.openLoginModal = openLoginModal;
    window.closeModal = closeModal;
    window.fetchPinsFromSupabase = fetchPinsFromSupabase;
    window.handleLoginSubmit = handleLoginSubmit;
    window.handleSavePin = handleSavePin;
    window.deleteActivePin = deleteActivePin;
    window.editActivePin = editActivePin;
    window.zoomMap = zoomMap;
    window.resetMapView = resetMapView;
    window.onImagesSelected = onImagesSelected;
    window.renderPins = renderPins;
    window.switchMap = switchMap;
