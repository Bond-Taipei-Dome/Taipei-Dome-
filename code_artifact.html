<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>場館點位管理與巡檢系統</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Swiper.js (用於照片輪播) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <!-- PDF.js (用於解析與繪製 PDF 地圖) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    // 設定 PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  
  <!-- Firebase 11.6.1 模組化 SDK 導入 (雲端資料庫與驗證) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, deleteDoc, onSnapshot, collection } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 全域變數取得
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'venue-inspection-app';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : null;

    let db = null;
    let auth = null;
    let currentUser = null;

    // 將 Firebase 操作物件掛載於 window 以供全局存取
    window.dbReady = false;

    if (firebaseConfig) {
      try {
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        // 登入驗證處理
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (e) {
            console.error("Auth initialization failed:", e);
          }
        };

        onAuthStateChanged(auth, (user) => {
          if (user) {
            currentUser = user;
            window.dbReady = true;
            setupFirestoreListeners();
          } else {
            initAuth();
          }
        });
      } catch (e) {
        console.error("Firebase Initialization Error:", e);
      }
    }

    // 監聽雲端資料庫變更 (即時同步)
    function setupFirestoreListeners() {
      if (!db || !currentUser) return;

      // 1. 監聽地圖清單
      const mapsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'maps');
      onSnapshot(mapsCollection, (snapshot) => {
        const loadedMaps = [];
        snapshot.forEach(docSnap => {
          loadedMaps.push(docSnap.data());
        });
        window.maps = loadedMaps;
        
        // 若當前沒有選取地圖或選取的地圖已被刪除，則選擇第一張
        if (loadedMaps.length > 0) {
          if (!window.currentMapId || !loadedMaps.some(m => m.id === window.currentMapId)) {
            window.currentMapId = loadedMaps[0].id;
            currentMapId = loadedMaps[0].id;
          }
        } else {
          window.currentMapId = '';
          currentMapId = '';
        }
        
        window.renderMapTabs();
        window.loadMap(window.currentMapId);
      }, (err) => console.error("Maps snapshot error:", err));

      // 2. 監聽點位資料
      const pinsCollection = collection(db, 'artifacts', appId, 'public', 'data', 'pins');
      onSnapshot(pinsCollection, (snapshot) => {
        const loadedPins = [];
        snapshot.forEach(docSnap => {
          loadedPins.push(docSnap.data());
        });
        window.pins = loadedPins;
        if (typeof window.renderPins === 'function') {
          window.renderPins();
        }
      }, (err) => console.error("Pins snapshot error:", err));
    }

    // 將寫入 / 刪除函數暴露至全域
    window.savePinToCloud = async (pinData) => {
      if (!db || !currentUser) return;
      try {
        const pinDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'pins', pinData.id);
        await setDoc(pinDocRef, pinData);
      } catch (e) {
        console.error("Save pin error:", e);
        window.showToast('寫入雲端失敗', 'error');
      }
    };

    window.deletePinFromCloud = async (pinId) => {
      if (!db || !currentUser) return;
      try {
        const pinDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'pins', pinId);
        await deleteDoc(pinDocRef);
      } catch (e) {
        console.error("Delete pin error:", e);
        window.showToast('刪除雲端資料失敗', 'error');
      }
    };

    window.deleteMapFromCloud = async (mapId) => {
      if (!db || !currentUser) return;
      try {
        const mapDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'maps', mapId);
        await deleteDoc(mapDocRef);

        // 同時刪除該地圖下的所有雲端點位
        const pinsToDelete = (window.pins || []).filter(p => p.mapId === mapId);
        for (const p of pinsToDelete) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'pins', p.id));
        }
      } catch (e) {
        console.error("Delete map cloud error:", e);
        window.showToast('刪除雲端地圖失敗', 'error');
      }
    };

    window.saveMapToCloud = async (mapData) => {
      if (!db || !currentUser) return;
      try {
        // 雲端僅保留地圖 ID 與名稱結構，避開 1MB 圖片限制
        const cloudMapMeta = {
          id: mapData.id,
          name: mapData.name,
          updatedAt: new Date().toISOString()
        };
        const mapDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'maps', mapData.id);
        await setDoc(mapDocRef, cloudMapMeta);
      } catch (e) {
        console.error("Save map metadata error:", e);
      }
    };
  </script>
  
  <style>
    /* 隱藏滾動條但保持功能 */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    /* 地圖容器脈衝與標籤動態 */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.35); opacity: 0.3; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .pin-pulse-ring {
      animation: pulse-ring 2s infinite ease-in-out;
    }
    
    /* Swiper 照片適應 */
    .swiper-slide img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      border-radius: 0.75rem;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-blue-500 selection:text-white">

  <!-- 頂部導覽列 -->
  <header class="bg-slate-800/90 backdrop-blur-md border-b border-slate-700 sticky top-0 z-30 px-4 py-3 flex items-center justify-between shadow-md">
    <div class="flex items-center space-x-2">
      <div class="bg-blue-600 p-2 rounded-lg shadow-lg">
        <i class="fa-solid fa-map-location-dot text-white text-lg"></i>
      </div>
      <div>
        <h1 class="font-bold text-base md:text-lg leading-tight">場館巡檢與點位管理</h1>
        <p class="text-xs text-slate-400" id="currentRoleBadge"><span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-1"></span>未登入</p>
      </div>
    </div>

    <!-- 權限切換 / 狀態按鈕 -->
    <div class="flex items-center space-x-2">
      <button id="exportBtn" onclick="exportData()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg text-xs flex items-center transition">
        <i class="fa-solid fa-file-export mr-1.5"></i>匯出
      </button>
      <button id="loginModalBtn" onclick="openLoginModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-3.5 py-1.5 rounded-lg text-xs font-medium shadow-md transition flex items-center">
        <i class="fa-solid fa-right-to-bracket mr-1.5"></i>切換權限
      </button>
    </div>
  </header>

  <!-- 地圖切換頁籤 -->
  <div class="bg-slate-800 border-b border-slate-700/80 px-4 py-2 flex items-center space-x-2 overflow-x-auto no-scrollbar z-20">
    <span class="text-xs text-slate-400 shrink-0 font-medium"><i class="fa-solid fa-layer-group mr-1"></i>切換地圖:</span>
    <div id="mapTabs" class="flex space-x-2">
      <!-- 地圖按鈕由 JS 動態生成 -->
    </div>
    <button onclick="openAddMapModal()" id="addMapBtn" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-300 px-2.5 py-1 rounded-full text-xs shrink-0 transition border border-dashed border-slate-500">
      <i class="fa-solid fa-plus mr-1"></i>新增地圖
    </button>
  </div>

  <!-- 主要互動地圖區域 -->
  <main class="relative flex-1 w-full bg-slate-950 overflow-hidden flex items-center justify-center min-h-[500px]" id="mapViewport">
    
    <!-- 未上傳地圖時的提示畫面 -->
    <div id="emptyMapNotice" class="hidden absolute inset-0 bg-slate-950 z-20 flex flex-col items-center justify-center p-6 text-center">
      <div class="w-16 h-16 bg-slate-800 text-slate-400 rounded-full flex items-center justify-center text-3xl mb-4 border border-slate-700">
        <i class="fa-solid fa-map"></i>
      </div>
      <h2 class="text-lg font-bold text-white mb-2">尚未上傳任何場館地圖</h2>
      <p class="text-xs text-slate-400 max-w-xs mb-6">請登入管理員權限，點擊上方選單的「＋ 新增地圖」上傳您的 PDF 或 JPG 地圖檔案。</p>
      <button onclick="openLoginModal()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2.5 rounded-xl text-xs font-semibold shadow-lg transition">
        登入管理員權限
      </button>
    </div>

    <!-- 地圖操作提示訊息 -->
    <div id="addPinHint" class="hidden absolute top-4 left-1/2 -translate-x-1/2 bg-amber-500/90 text-slate-900 px-4 py-2 rounded-full text-xs font-bold shadow-lg z-20 pointer-events-none flex items-center animate-bounce">
      <i class="fa-solid fa-crosshairs mr-2"></i>請點擊地圖任意位置以新增點位
    </div>

    <!-- 地圖主體與標記容器 -->
    <div id="mapContainer" class="relative inline-block transition-transform duration-100 ease-out cursor-grab active:cursor-grabbing select-none" style="transform-origin: 0 0;">
      <img id="mapImage" src="" alt="場館地圖" class="max-w-none block pointer-events-none" onload="onMapLoaded()">
      <!-- 點位標籤渲染層 -->
      <div id="pinsLayer" class="absolute inset-0"></div>
    </div>

    <!-- 縮放與控制浮動按鈕 (右下角) -->
    <div class="absolute bottom-6 right-4 flex flex-col space-y-2 z-20">
      <button onclick="zoomMap(1.2)" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-lg border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-plus"></i>
      </button>
      <button onclick="zoomMap(0.8)" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-lg border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-minus"></i>
      </button>
      <button onclick="resetMapView()" class="w-10 h-10 bg-slate-800/90 hover:bg-slate-700 text-slate-200 rounded-full shadow-lg border border-slate-600 flex items-center justify-center active:scale-95 transition">
        <i class="fa-solid fa-compress"></i>
      </button>
    </div>
  </main>

  <!-- 登入權限彈窗 Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-6 shadow-2xl relative">
      <button onclick="closeModal('loginModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <h3 class="text-lg font-bold text-white mb-1">管理員身分驗證</h3>
      <p class="text-xs text-slate-400 mb-4">請輸入管理權限存取密碼：</p>
      
      <form onsubmit="handleLogin(event)">
        <div class="mb-5">
          <label class="block text-xs text-slate-300 font-medium mb-1">管理密碼</label>
          <input type="password" id="accessPasswordInput" placeholder="請輸入密碼" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-blue-500 transition">
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl shadow-lg transition">
          確認登入
        </button>
      </form>
    </div>
  </div>

  <!-- 新增/編輯點位 Modal -->
  <div id="pinEditModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- 標題欄 -->
      <div class="px-5 py-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/90">
        <h3 id="pinModalTitle" class="font-bold text-white text-base">新增點位說明</h3>
        <button onclick="closeModal('pinEditModal')" class="text-slate-400 hover:text-white">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- 表單內容區域 (可滾動) -->
      <form id="pinForm" onsubmit="savePin(event)" class="p-5 overflow-y-auto space-y-4 text-sm flex-1">
        <input type="hidden" id="pinId">
        <input type="hidden" id="pinX">
        <input type="hidden" id="pinY">

        <div>
          <label class="block text-xs text-slate-300 font-medium mb-1">事件 / 點位標題 <span class="text-rose-500">*</span></label>
          <input type="text" id="pinTitle" required placeholder="例如：展區A牆面破損" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2.5 text-white focus:outline-none focus:border-blue-500">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs text-slate-300 font-medium mb-1">責任單位 <span class="text-rose-500">*</span></label>
            <input type="text" id="pinDepartment" required placeholder="例如：營修組 / 機電科" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-xs text-slate-300 font-medium mb-1">預計復原日期</label>
            <input type="date" id="pinRestoreDate" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <div>
          <label class="block text-xs text-slate-300 font-medium mb-1">復原方式 / 處置說明</label>
          <textarea id="pinRestoreMethod" rows="2" placeholder="說明維修流程或應急處置方案..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <div>
          <label class="block text-xs text-slate-300 font-medium mb-1">詳細備註說明</label>
          <textarea id="pinDescription" rows="2" placeholder="詳細描述現況..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3.5 py-2 text-white focus:outline-none focus:border-blue-500"></textarea>
        </div>

        <!-- 照片上傳區塊 -->
        <div>
          <label class="block text-xs text-slate-300 font-medium mb-1">現場照片 (可多張)</label>
          <input type="file" id="pinImageInput" accept="image/*" multiple onchange="handleImageUpload(event)" class="hidden">
          
          <div class="flex items-center space-x-2">
            <button type="button" onclick="document.getElementById('pinImageInput').click()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3.5 py-2 rounded-xl text-xs font-medium border border-slate-600 transition flex items-center">
              <i class="fa-solid fa-camera mr-1.5 text-blue-400"></i>選擇 / 拍攝照片
            </button>
            <span id="imageCountBadge" class="text-xs text-slate-400">已選取 0 張</span>
          </div>
          
          <!-- 上傳預覽容器 -->
          <div id="imagePreviewContainer" class="flex space-x-2 overflow-x-auto py-2 mt-2"></div>
        </div>

        <!-- 按鈕 -->
        <div class="pt-2 flex justify-end space-x-2 border-t border-slate-700/80">
          <button type="button" onclick="closeModal('pinEditModal')" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-xl font-medium text-xs">取消</button>
          <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-xl font-semibold text-xs shadow-md">儲存點位</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 點位詳細內容檢視 Modal (訪客/管理者點擊點位圖標時彈出) -->
  <div id="pinViewModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-t-2xl sm:rounded-2xl w-full max-w-lg max-h-[92vh] flex flex-col shadow-2xl overflow-hidden">
      <!-- 頂部與關閉 -->
      <div class="p-4 border-b border-slate-700 flex justify-between items-start bg-slate-800/90">
        <div>
          <span id="viewPinDept" class="inline-block bg-blue-600/30 text-blue-300 border border-blue-500/30 text-[11px] px-2.5 py-0.5 rounded-full font-medium mb-1">責任單位</span>
          <h3 id="viewPinTitle" class="text-lg font-bold text-white">點位名稱</h3>
        </div>
        <button onclick="closeModal('pinViewModal')" class="text-slate-400 hover:text-white p-1">
          <i class="fa-solid fa-xmark text-xl"></i>
        </button>
      </div>

      <!-- 內容區 -->
      <div class="p-5 overflow-y-auto space-y-4 text-xs sm:text-sm flex-1">
        <!-- 照片輪播區 (Swiper) -->
        <div id="swiperContainer" class="swiper w-full rounded-xl overflow-hidden bg-slate-900 border border-slate-700">
          <div class="swiper-wrapper" id="viewPinPhotos">
            <!-- 動態插入 Swiper Slides -->
          </div>
          <div class="swiper-pagination"></div>
          <div class="swiper-button-next !text-white/80 scale-75"></div>
          <div class="swiper-button-prev !text-white/80 scale-75"></div>
        </div>

        <!-- 欄位資訊卡片 -->
        <div class="grid grid-cols-2 gap-2 bg-slate-900/60 p-3 rounded-xl border border-slate-700/60">
          <div>
            <span class="text-slate-400 text-[11px] block">建立日期</span>
            <span id="viewPinCreated" class="font-medium text-slate-200">2026-10-31</span>
          </div>
          <div>
            <span class="text-slate-400 text-[11px] block">預計復原日期</span>
            <span id="viewPinRestoreDate" class="font-medium text-amber-400">未設定</span>
          </div>
        </div>

        <div>
          <h4 class="text-slate-400 text-[11px] font-semibold uppercase tracking-wider mb-1"><i class="fa-solid fa-wrench mr-1"></i>復原方式 / 處置</h4>
          <p id="viewPinRestoreMethod" class="text-slate-200 bg-slate-900/40 p-3 rounded-xl border border-slate-700/40 leading-relaxed">無說明</p>
        </div>

        <div>
          <h4 class="text-slate-400 text-[11px] font-semibold uppercase tracking-wider mb-1"><i class="fa-solid fa-align-left mr-1"></i>詳細說明</h4>
          <p id="viewPinDesc" class="text-slate-300 bg-slate-900/40 p-3 rounded-xl border border-slate-700/40 leading-relaxed">無詳細備註</p>
        </div>
      </div>

      <!-- 底部操作區 (僅限有權限者) -->
      <div id="viewModalFooter" class="p-4 border-t border-slate-700 bg-slate-800 flex justify-between items-center">
        <!-- 刪除按鈕 (僅超級管理員可見) -->
        <button id="deletePinBtn" onclick="deleteCurrentPin()" class="hidden text-rose-400 hover:bg-rose-500/20 px-3 py-2 rounded-xl text-xs font-semibold transition">
          <i class="fa-solid fa-trash-can mr-1.5"></i>刪除點位
        </button>

        <!-- 編輯按鈕 (管理員與超級管理員可見) -->
        <button id="editPinBtn" onclick="editCurrentPin()" class="hidden bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2 rounded-xl text-xs font-semibold ml-auto transition">
          <i class="fa-solid fa-pen-to-square mr-1.5"></i>編輯內容
        </button>
      </div>
    </div>
  </div>

  <!-- 新增地圖 Modal -->
  <div id="addMapModal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-sm p-5 shadow-2xl relative">
      <button onclick="closeModal('addMapModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>
      <h3 class="text-base font-bold text-white mb-3">新增場館地圖</h3>
      <form onsubmit="addNewMap(event)">
        <div class="space-y-3 mb-4">
          <div>
            <label class="block text-xs text-slate-300 mb-1">地圖名稱</label>
            <input type="text" id="newMapName" required placeholder="例如：2F 主展演廳" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-300 mb-1">上傳地圖檔案 (支援 PDF / JPG / PNG / SVG)</label>
            <input type="file" id="newMapFileInput" accept="application/pdf,image/*" required class="w-full text-xs text-slate-400 file:mr-3 file:py-1.5 file:px-3 file:rounded-xl file:border-0 file:text-xs file:bg-blue-600 file:text-white hover:file:bg-blue-500">
            <p class="text-[10px] text-slate-400 mt-1">* 提示：上傳 PDF 時，系統將自動解析第一頁轉為高清地圖圖片。</p>
          </div>
        </div>
        <button type="submit" id="submitMapBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-xl text-xs flex items-center justify-center">
          <span>建立地圖圖層</span>
        </button>
      </form>
    </div>
  </div>

  <!-- 全域視訊與訊息提示 Toast -->
  <div id="toast" class="fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-800 border border-slate-600 text-white px-4 py-2.5 rounded-full text-xs shadow-2xl z-50 transition-all opacity-0 pointer-events-none flex items-center space-x-2">
    <i id="toastIcon" class="fa-solid fa-circle-info text-blue-400"></i>
    <span id="toastMsg">提示訊息</span>
  </div>

  <script>
    /* ==================== 預設範例資料與狀態管理 ==================== */
    const ROLES = {
      NONE: 'NONE',
      VISITOR: 'VISITOR',       // 訪客模式
      ADMIN: 'ADMIN',           // 管理員
      SUPERADMIN: 'SUPERADMIN'  // 超級管理員
    };

    /* ==================== IndexedDB 超海量本機圖庫管理 ==================== */
    const DB_NAME = 'VenueMapDB';
    const STORE_NAME = 'maps_store';

    function initIndexedDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        request.onsuccess = (e) => resolve(e.target.result);
        request.onerror = (e) => reject(e);
      });
    }

    async function saveMapToIndexedDB(id, name, dataUrl) {
      try {
        const db = await initIndexedDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put({ id, name, dataUrl });
      } catch (err) {
        console.error("IndexedDB Save Error:", err);
      }
    }

    async function deleteMapFromIndexedDB(id) {
      try {
        const db = await initIndexedDB();
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(id);
      } catch (err) {
        console.error("IndexedDB Delete Error:", err);
      }
    }

    async function getMapFromIndexedDB(id) {
      try {
        const db = await initIndexedDB();
        return new Promise((resolve) => {
          const tx = db.transaction(STORE_NAME, 'readonly');
          const store = tx.objectStore(STORE_NAME);
          const req = store.get(id);
          req.onsuccess = () => resolve(req.result ? req.result.dataUrl : null);
          req.onerror = () => resolve(null);
        });
      } catch (err) {
        return null;
      }
    }

    let currentUserRole = ROLES.NONE;
    let currentMapId = '';
    window.currentMapId = currentMapId;

    // 清空預設範例地圖，初始由使用者自訂上傳
    let maps = [];
    window.maps = maps;

    // 點位資料庫
    let pins = [];
    window.pins = pins;

    // 暫存圖像上傳 Base64 Array
    let currentUploadedImages = [];
    let selectedPinIdForView = null;
    let swiperInstance = null;

    /* ==================== 地圖縮放與拖曳變數 ==================== */
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX, startY;

    const viewport = document.getElementById('mapViewport');
    const container = document.getElementById('mapContainer');
    const mapImg = document.getElementById('mapImage');

    /* ==================== 初始化與事件監聽 ==================== */
    window.onload = function() {
      renderMapTabs();
      loadMap(currentMapId);
      setupMapDragAndZoom();

      // 預設給予訪客瀏覽權限
      currentUserRole = ROLES.VISITOR;
      document.getElementById('currentRoleBadge').innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-blue-400 mr-1"></span>訪客模式 (瀏覽中)`;
    };

    // 將核心 DOM 渲染邏輯暴露給 Window 以方便 Firebase 回調呼叫
    window.renderMapTabs = renderMapTabs;
    window.loadMap = loadMap;
    window.renderPins = renderPins;

    /* ==================== 權限驗證邏輯 ==================== */
    function handleLogin(e) {
      e.preventDefault();
      const pwd = document.getElementById('accessPasswordInput').value.trim();
      const badge = document.getElementById('currentRoleBadge');
      const addMapBtn = document.getElementById('addMapBtn');
      const exportBtn = document.getElementById('exportBtn');

      if (pwd === '1234') {
        currentUserRole = ROLES.VISITOR;
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-blue-400 mr-1"></span>訪客權限 (瀏覽模式)`;
        showToast('已以【訪客】身份登入', 'info');
      } else if (pwd === 'admin') {
        currentUserRole = ROLES.ADMIN;
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-emerald-400 mr-1"></span>巡檢管理員 (可編輯)`;
        showToast('已以【巡檢管理員】身份登入', 'success');
      } else if (pwd === 'superadmin') {
        currentUserRole = ROLES.SUPERADMIN;
        badge.innerHTML = `<span class="inline-block w-2 h-2 rounded-full bg-purple-400 mr-1"></span>超級管理員 (最高權限)`;
        showToast('已解鎖【超級管理員】完整權限', 'success');
      } else {
        showToast('密碼錯誤，請重新輸入！', 'error');
        return;
      }

      // 控制 UI 權限按鈕顯隱
      if (currentUserRole === ROLES.ADMIN || currentUserRole === ROLES.SUPERADMIN) {
        addMapBtn.classList.remove('hidden');
        exportBtn.classList.remove('hidden');
        document.getElementById('addPinHint').classList.remove('hidden');
      } else {
        addMapBtn.classList.add('hidden');
        exportBtn.classList.remove('hidden');
        document.getElementById('addPinHint').classList.add('hidden');
      }

      closeModal('loginModal');
      document.getElementById('accessPasswordInput').value = '';
      renderPins();
    }

    function openLoginModal() {
      document.getElementById('loginModal').classList.remove('hidden');
    }

    /* ==================== 地圖與點位渲染 ==================== */
    function renderMapTabs() {
      const tabsContainer = document.getElementById('mapTabs');
      tabsContainer.innerHTML = '';

      if (!window.maps || window.maps.length === 0) {
        tabsContainer.innerHTML = '<span class="text-xs text-slate-500 italic">尚無地圖</span>';
        return;
      }

      window.maps.forEach(m => {
        const active = m.id === currentMapId;
        const tabWrapper = document.createElement('div');
        tabWrapper.className = 'flex items-center space-x-1 shrink-0';

        const btn = document.createElement('button');
        btn.className = `px-3.5 py-1 rounded-full text-xs font-medium transition ${
          active ? 'bg-blue-600 text-white shadow-md font-semibold' : 'bg-slate-700/60 hover:bg-slate-700 text-slate-300'
        }`;
        btn.innerText = m.name;
        btn.onclick = () => switchMap(m.id);
        tabWrapper.appendChild(btn);

        // 若為超級管理員且該頁籤為選中狀態，顯示刪除地圖按鈕
        if (currentUserRole === ROLES.SUPERADMIN && active) {
          const delMapBtn = document.createElement('button');
          delMapBtn.className = 'bg-rose-600/80 hover:bg-rose-600 text-white w-6 h-6 rounded-full text-[10px] flex items-center justify-center transition shadow';
          delMapBtn.title = '刪除此地圖';
          delMapBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
          delMapBtn.onclick = (e) => {
            e.stopPropagation();
            deleteCurrentMap(m.id, m.name);
          };
          tabWrapper.appendChild(delMapBtn);
        }

        tabsContainer.appendChild(tabWrapper);
      });
    }

    async function deleteCurrentMap(mapId, mapName) {
      if (!confirm(`確定要刪除地圖「${mapName}」及其附屬的所有點位資料嗎？此操作無法恢復！`)) return;

      // 1. 刪除 IndexedDB
      await deleteMapFromIndexedDB(mapId);

      // 2. 刪除雲端紀錄
      if (window.deleteMapFromCloud) {
        await window.deleteMapFromCloud(mapId);
      }

      // 3. 本機變數清理
      window.maps = (window.maps || []).filter(m => m.id !== mapId);
      window.pins = (window.pins || []).filter(p => p.mapId !== mapId);

      if (window.maps.length > 0) {
        currentMapId = window.maps[0].id;
        window.currentMapId = currentMapId;
      } else {
        currentMapId = '';
        window.currentMapId = '';
      }

      renderMapTabs();
      loadMap(currentMapId);
      showToast(`已成功刪除地圖「${mapName}」！`, 'info');
    }

    function switchMap(mapId) {
      if (currentMapId === mapId) return;
      currentMapId = mapId;
      window.currentMapId = mapId;
      renderMapTabs();
      loadMap(mapId);
    }

    async function loadMap(mapId) {
      const emptyNotice = document.getElementById('emptyMapNotice');
      if (!window.maps || window.maps.length === 0) {
        emptyNotice.classList.remove('hidden');
        mapImg.src = '';
        renderPins();
        return;
      }

      emptyNotice.classList.add('hidden');
      const mapObj = window.maps.find(m => m.id === mapId) || window.maps[0];
      if (mapObj) {
        currentMapId = mapObj.id;
        window.currentMapId = mapObj.id;

        // 優先從 IndexedDB 高清儲存庫讀取
        let mapDataUrl = await getMapFromIndexedDB(mapObj.id);
        if (!mapDataUrl) {
          mapDataUrl = mapObj.url || '';
        }
        mapImg.src = mapDataUrl;
      }
      renderPins();
    }

    function onMapLoaded() {
      resetMapView();
      renderPins();
    }

    function renderPins() {
      const pinsLayer = document.getElementById('pinsLayer');
      pinsLayer.innerHTML = '';

      if (!currentMapId) return;

      // 嚴格篩選出只屬於當前地圖的點位
      const currentPins = (window.pins || []).filter(p => p.mapId === currentMapId);

      currentPins.forEach(pin => {
        const pinEl = document.createElement('div');
        // 確保定位參考點落在中心下方 (即地圖座標對齊標記尖端)
        pinEl.className = 'absolute z-30 cursor-pointer group -translate-x-1/2 -translate-y-full';
        pinEl.style.left = `${pin.x}%`;
        pinEl.style.top = `${pin.y}%`;

        pinEl.innerHTML = `
          <div class="relative flex flex-col items-center">
            <!-- 外圍波紋動畫圈 -->
            <div class="absolute -inset-2 rounded-full bg-rose-500/40 pin-pulse-ring pointer-events-none"></div>
            <!-- 主點位按鈕 -->
            <div class="relative bg-gradient-to-tr from-rose-600 to-red-500 hover:from-rose-500 hover:to-red-400 text-white w-9 h-9 rounded-full shadow-2xl border-2 border-white flex items-center justify-center transition-all transform group-hover:scale-125">
              <i class="fa-solid fa-location-dot text-base drop-shadow"></i>
            </div>
            <!-- 下方提示標籤 -->
            <div class="mt-1 whitespace-nowrap bg-slate-900/95 text-white text-[11px] font-bold px-2 py-0.5 rounded-md shadow-xl border border-slate-700 pointer-events-none">
              ${pin.title}
            </div>
          </div>
        `;

        pinEl.onclick = (e) => {
          e.stopPropagation(); // 阻止地圖點擊事件
          openPinDetailModal(pin.id);
        };

        pinsLayer.appendChild(pinEl);
      });
    }

    /* ==================== 互動：點擊地圖新增點位 ==================== */
    function setupMapDragAndZoom() {
      // 區分「拖拽」與「點擊」
      let isMoved = false;

      // 地圖手勢 / 滑鼠拖曳與觸控功能
      const startDrag = (clientX, clientY) => {
        isDragging = true;
        isMoved = false; // 初始化滑動狀態
        startX = clientX - panX;
        startY = clientY - panY;
      };

      const moveDrag = (clientX, clientY) => {
        if (!isDragging) return;
        const dx = clientX - (startX + panX);
        const dy = clientY - (startY + panY);
        
        // 拖移超過 5px 即判定為位移，不觸發點選新增
        if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
          isMoved = true;
        }

        panX = clientX - startX;
        panY = clientY - startY;
        updateTransform();
      };

      const endDrag = () => {
        isDragging = false;
      };

      // 滑鼠事件
      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.pin-animate')) return;
        startDrag(e.clientX, e.clientY);
      });

      window.addEventListener('mousemove', (e) => {
        moveDrag(e.clientX, e.clientY);
      });

      window.addEventListener('mouseup', endDrag);

      // 觸控手勢支援 (手機平板專用)
      viewport.addEventListener('touchstart', (e) => {
        if (e.target.closest('.pin-animate')) return;
        if (e.touches.length === 1) {
          startDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1) {
          moveDrag(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      window.addEventListener('touchend', endDrag);

      // 點擊地圖座標轉換為百分比 (僅在未拖移時觸發)
      container.onclick = (e) => {
        // 如果剛才發生過地圖拖移，則不處理點位新增
        if (isMoved) return;

        if (currentUserRole === ROLES.NONE || currentUserRole === ROLES.VISITOR) {
          if (currentUserRole === ROLES.VISITOR) {
            showToast('訪客模式無法新增點位，請切換管理員權限', 'info');
          }
          return;
        }

        const rect = container.getBoundingClientRect();
        const clickX = e.clientX - rect.left;
        const clickY = e.clientY - rect.top;

        // 計算點擊位置比例 (0-100%)
        const pctX = ((clickX / rect.width) * 100).toFixed(1);
        const pctY = ((clickY / rect.height) * 100).toFixed(1);

        openAddPinModal(pctX, pctY);
      };

      // 滾輪縮放
      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();
        const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
        zoomMap(zoomFactor);
      }, { passive: false });
    }

    function updateTransform() {
      container.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    function zoomMap(factor) {
      scale = Math.min(Math.max(0.5, scale * factor), 4);
      updateTransform();
    }

    function resetMapView() {
      scale = 1;
      panX = 0;
      panY = 0;
      updateTransform();
    }

    /* ==================== Modal 控制與點位表單邏輯 ==================== */
    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }

    function openAddPinModal(x, y) {
      document.getElementById('pinForm').reset();
      document.getElementById('pinId').value = '';
      document.getElementById('pinX').value = x;
      document.getElementById('pinY').value = y;
      document.getElementById('pinModalTitle').innerText = '新增點位說明';
      currentUploadedImages = [];
      renderImagePreviews();
      document.getElementById('pinEditModal').classList.remove('hidden');
    }

    function handleImageUpload(event) {
      const files = Array.from(event.target.files);
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          currentUploadedImages.push(e.target.result);
          renderImagePreviews();
        };
        reader.readAsDataURL(file);
      });
    }

    function renderImagePreviews() {
      const container = document.getElementById('imagePreviewContainer');
      const badge = document.getElementById('imageCountBadge');
      container.innerHTML = '';
      badge.innerText = `已選取 ${currentUploadedImages.length} 張`;

      currentUploadedImages.forEach((imgSrc, index) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'relative shrink-0 w-16 h-16 rounded-lg overflow-hidden border border-slate-700 group';
        wrapper.innerHTML = `
          <img src="${imgSrc}" class="w-full h-full object-cover">
          <button type="button" onclick="removeUploadedImage(${index})" class="absolute top-1 right-1 bg-rose-600/90 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center shadow">
            <i class="fa-solid fa-xmark"></i>
          </button>
        `;
        container.appendChild(wrapper);
      });
    }

    function removeUploadedImage(index) {
      currentUploadedImages.splice(index, 1);
      renderImagePreviews();
    }

    function savePin(e) {
      e.preventDefault();
      const pinId = document.getElementById('pinId').value || `pin-${Date.now()}`;
      const existingPinIndex = window.pins.findIndex(p => p.id === pinId);

      const pinData = {
        id: pinId,
        mapId: currentMapId,
        x: parseFloat(document.getElementById('pinX').value),
        y: parseFloat(document.getElementById('pinY').value),
        title: document.getElementById('pinTitle').value.trim(),
        department: document.getElementById('pinDepartment').value.trim(),
        restoreDate: document.getElementById('pinRestoreDate').value,
        restoreMethod: document.getElementById('pinRestoreMethod').value.trim(),
        description: document.getElementById('pinDescription').value.trim(),
        createdDate: existingPinIndex >= 0 ? window.pins[existingPinIndex].createdDate : new Date().toISOString().split('T')[0],
        images: currentUploadedImages.length > 0 ? [...currentUploadedImages] : [
          'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=600&auto=format&fit=crop'
        ]
      };

      // 本機陣列同步備份，確保畫面上第一時間顯影
      if (existingPinIndex >= 0) {
        window.pins[existingPinIndex] = pinData;
      } else {
        window.pins.push(pinData);
      }
      renderPins();

      // 寫入雲端資料庫
      if (window.savePinToCloud) {
        window.savePinToCloud(pinData);
      }

      showToast(existingPinIndex >= 0 ? '已修改點位資訊！' : '已成功建立新點位！', 'success');
      closeModal('pinEditModal');
    }

    /* ==================== 檢視點位 Modal ==================== */
    function openPinDetailModal(pinId) {
      const pin = window.pins.find(p => p.id === pinId);
      if (!pin) return;

      selectedPinIdForView = pinId;
      document.getElementById('viewPinTitle').innerText = pin.title;
      document.getElementById('viewPinDept').innerText = `責任單位：${pin.department}`;
      document.getElementById('viewPinCreated').innerText = pin.createdDate || '未紀錄';
      document.getElementById('viewPinRestoreDate').innerText = pin.restoreDate || '未設定';
      document.getElementById('viewPinRestoreMethod').innerText = pin.restoreMethod || '無說明';
      document.getElementById('viewPinDesc').innerText = pin.description || '無詳細備註';

      // 權限控制底部按鈕
      const editBtn = document.getElementById('editPinBtn');
      const deleteBtn = document.getElementById('deletePinBtn');

      if (currentUserRole === ROLES.ADMIN || currentUserRole === ROLES.SUPERADMIN) {
        editBtn.classList.remove('hidden');
      } else {
        editBtn.classList.add('hidden');
      }

      if (currentUserRole === ROLES.SUPERADMIN) {
        deleteBtn.classList.remove('hidden');
      } else {
        deleteBtn.classList.add('hidden');
      }

      // 渲染 Swiper 照片輪播
      const swiperWrapper = document.getElementById('viewPinPhotos');
      swiperWrapper.innerHTML = '';
      const imgs = (pin.images && pin.images.length > 0) ? pin.images : [
        'https://images.unsplash.com/photo-1584622650111-993a426fbf0a?q=80&w=600&auto=format&fit=crop'
      ];

      imgs.forEach(img => {
        const slide = document.createElement('div');
        slide.className = 'swiper-slide';
        slide.innerHTML = `<img src="${img}" alt="點位現場照片">`;
        swiperWrapper.appendChild(slide);
      });

      // 初始化或更新 Swiper
      if (swiperInstance) {
        swiperInstance.destroy();
      }
      swiperInstance = new Swiper('#swiperContainer', {
        pagination: { el: '.swiper-pagination', clickable: true },
        navigation: { nextEl: '.swiper-button-next', prevEl: '.swiper-button-prev' }
      });

      document.getElementById('pinViewModal').classList.remove('hidden');
    }

    function editCurrentPin() {
      const pin = window.pins.find(p => p.id === selectedPinIdForView);
      if (!pin) return;

      closeModal('pinViewModal');
      document.getElementById('pinId').value = pin.id;
      document.getElementById('pinX').value = pin.x;
      document.getElementById('pinY').value = pin.y;
      document.getElementById('pinTitle').value = pin.title;
      document.getElementById('pinDepartment').value = pin.department;
      document.getElementById('pinRestoreDate').value = pin.restoreDate || '';
      document.getElementById('pinRestoreMethod').value = pin.restoreMethod || '';
      document.getElementById('pinDescription').value = pin.description || '';
      document.getElementById('pinModalTitle').innerText = '編輯點位資訊';

      currentUploadedImages = pin.images ? [...pin.images] : [];
      renderImagePreviews();

      document.getElementById('pinEditModal').classList.remove('hidden');
    }

    function deleteCurrentPin() {
      if (!selectedPinIdForView) return;
      if (confirm('確定要刪除此點位與其完整歷史紀錄嗎？')) {
        if (window.deletePinFromCloud) {
          window.deletePinFromCloud(selectedPinIdForView);
        } else {
          window.pins = window.pins.filter(p => p.id !== selectedPinIdForView);
          renderPins();
        }
        closeModal('pinViewModal');
        showToast('已成功刪除點位！', 'info');
      }
    }

    /* ==================== 新增地圖圖層 (支援 PDF / 圖片) ==================== */
    function openAddMapModal() {
      document.getElementById('addMapModal').classList.remove('hidden');
    }

    async function addNewMap(e) {
      e.preventDefault();
      const name = document.getElementById('newMapName').value.trim();
      const fileInput = document.getElementById('newMapFileInput');
      const submitBtn = document.getElementById('submitMapBtn');

      if (!fileInput.files || fileInput.files.length === 0) return;

      const file = fileInput.files[0];
      submitBtn.disabled = true;
      submitBtn.innerText = '超高清渲染與儲存中...';

      try {
        let imageUrl = '';

        if (file.type === 'application/pdf') {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
          const page = await pdf.getPage(1);

          // 超高清渲染 (3.5x 倍率，最高解析度支援至 4096px，細節文字清晰無比)
          const unscaledViewport = page.getViewport({ scale: 1.0 });
          const targetScale = Math.min(3.5, 4096 / unscaledViewport.width);
          const viewport = page.getViewport({ scale: targetScale });

          const canvas = document.createElement('canvas');
          const ctx = canvas.getContext('2d');
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          await page.render({ canvasContext: ctx, viewport: viewport }).promise;
          imageUrl = canvas.toDataURL('image/jpeg', 0.92);
        } else {
          imageUrl = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (evt) => {
              const img = new Image();
              img.onload = () => {
                const canvas = document.createElement('canvas');
                let width = img.width;
                let height = img.height;
                const maxDim = 4096; // 4096px 最高畫質

                if (width > maxDim || height > maxDim) {
                  if (width > height) {
                    height = Math.round((height * maxDim) / width);
                    width = maxDim;
                  } else {
                    width = Math.round((width * maxDim) / height);
                    height = maxDim;
                  }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.imageSmoothingEnabled = true;
                ctx.imageSmoothingQuality = 'high';
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.92));
              };
              img.src = evt.target.result;
            };
            reader.readAsDataURL(file);
          });
        }

        const mapId = `map-${Date.now()}`;

        // 1. 將超高清地圖存入 IndexedDB（無 1MB 限制，永遠不崩潰）
        await saveMapToIndexedDB(mapId, name, imageUrl);

        const newMapObj = {
          id: mapId,
          name: name,
          url: imageUrl
        };

        if (!window.maps) window.maps = [];
        window.maps.push(newMapObj);

        // 2. 雲端同步僅傳送輕量元數據 (Metadata)，點位依然全場館即時同步
        if (window.saveMapToCloud) {
          window.saveMapToCloud({ id: mapId, name: name });
        }

        closeModal('addMapModal');
        switchMap(newMapObj.id);
        showToast(`成功匯入高清地圖「${name}」！`, 'success');
      } catch (err) {
        console.error("Map upload error:", err);
        showToast('處理檔案時發生錯誤，請重試！', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = '建立地圖圖層';
      }
    }

    /* ==================== 資料匯出 (JSON 檔) ==================== */
    function exportData() {
      const exportObject = {
        maps: window.maps,
        pins: window.pins,
        exportedAt: new Date().toISOString()
      };
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObject, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `venue-pins-export-${new Date().toISOString().split('T')[0]}.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
      showToast('資料已成功匯出 JSON 檔案！', 'success');
    }

    /* ==================== Toast 提示訊息 ==================== */
    function showToast(msg, type = 'info') {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toastMsg');
      const toastIcon = document.getElementById('toastIcon');

      toastMsg.innerText = msg;
      if (type === 'success') {
        toastIcon.className = 'fa-solid fa-circle-check text-emerald-400';
      } else if (type === 'error') {
        toastIcon.className = 'fa-solid fa-circle-xmark text-rose-400';
      } else {
        toastIcon.className = 'fa-solid fa-circle-info text-blue-400';
      }

      toast.classList.remove('opacity-0', 'pointer-events-none');
      toast.classList.add('opacity-100');

      setTimeout(() => {
        toast.classList.remove('opacity-100');
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2500);
    }
    window.showToast = showToast;
  </script>
</body>
</html>
