<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>臺北大巨蛋巡檢系統 v2026.11.04 版</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- FontAwesome 6 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body, html {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans TC", sans-serif;
      font-size: 17px;
      overflow: hidden;
      background-color: #090d16;
    }

    /* 全域日期與時間選擇器顏色調整 */
    input[type="date"]::-webkit-calendar-picker-indicator,
    input[type="datetime-local"]::-webkit-calendar-picker-indicator {
      filter: brightness(0) invert(1);
      cursor: pointer;
      opacity: 0.9;
      transform: scale(1.25);
      padding: 2px;
    }

    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 觸控按鈕與點位 50px/56px 優化 */
    .touch-btn {
      min-height: 56px !important;
      min-width: 56px !important;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .custom-pin {
      position: absolute;
      width: 50px !important;
      height: 50px !important;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 800;
      font-size: 18px;
      border: 3px solid #ffffff;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.75);
      cursor: pointer;
      user-select: none;
      transform: translate(-50%, -50%) scale(var(--inv-scale, 1));
      transform-origin: center center;
      transition: background-color 0.2s, box-shadow 0.2s;
      z-index: 10;
    }
    .custom-pin:hover {
      z-index: 30;
      box-shadow: 0 0 20px rgba(245, 158, 11, 0.95);
      border-color: #fde68a;
    }

    .pin-unrestored {
      background: radial-gradient(circle at 30% 30%, #f87171, #dc2626);
      animation: pulse-red 2.2s infinite;
    }
    .pin-restored {
      background: radial-gradient(circle at 30% 30%, #34d399, #059669);
    }
    .pin-highlight {
      animation: highlight-bounce 0.8s ease-in-out 4 !important;
      z-index: 40 !important;
      border-color: #fbbf24 !important;
    }

    @keyframes pulse-red {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.8), 0 4px 10px rgba(0,0,0,0.5); }
      70% { box-shadow: 0 0 0 14px rgba(239, 68, 68, 0), 0 4px 10px rgba(0,0,0,0.5); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0), 0 4px 10px rgba(0,0,0,0.5); }
    }

    @keyframes highlight-bounce {
      0%, 100% { transform: translate(-50%, -50%) scale(var(--inv-scale, 1)); }
      50% { transform: translate(-50%, -85%) scale(calc(var(--inv-scale, 1) * 1.45)); box-shadow: 0 0 25px #fbbf24; }
    }

    #toastContainer {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 10px;
      pointer-events: none;
    }
    .toast-item { pointer-events: auto; }

    /* GPU 繪圖硬體加速 */
    #mapStage {
      will-change: transform;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    /* 附件二十四 官方 A4 格式排版與列印 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm;
      }
      body, html {
        height: auto !important;
        overflow: visible !important;
        background-color: #ffffff !important;
        color: #000000 !important;
        font-size: 11px !important;
      }
      header, #viewport, #toastContainer, .no-print,
      #loginModal, #pinModal, #viewModal, #confirmDeleteModal, #cloudConfigModal, #lightboxModal,
      #projectHeaderModal {
        display: none !important;
      }
      main {
        overflow: visible !important;
        height: auto !important;
      }
      #listViewContainer {
        display: block !important;
        height: auto !important;
        overflow: visible !important;
        padding: 0 !important;
        background-color: #ffffff !important;
        color: #000000 !important;
      }
    }
  </style>

  <script>
    // 率先宣告全域事件 Handlers，確保 DOM 解析時存取無虞
    window.onMapLoaded = function() {
      const overlay = document.getElementById('mapLoadingOverlay');
      if (overlay) overlay.classList.add('opacity-0', 'pointer-events-none');
      if (typeof window.fitMapToScreen === 'function') window.fitMapToScreen();
      if (typeof window.renderPins === 'function') window.renderPins();
    };

    window.onMapError = function() {
      console.warn("原圖資載入逾時，啟動 CDN 鏡像與向量藍圖保護機制");
      const mapImg = document.getElementById('mapImage');
      const overlay = document.getElementById('mapLoadingOverlay');
      if (overlay) overlay.classList.add('opacity-0', 'pointer-events-none');
      if (mapImg && typeof window.generateFallbackBlueprintSVG === 'function') {
        const curMap = window.MAPS ? window.MAPS[window.currentMapId] : null;
        mapImg.src = window.generateFallbackBlueprintSVG(curMap ? curMap.name : '大巨蛋平面圖');
      }
    };
  </script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-screen select-none">

  <!-- Toast 提示容器 -->
  <div id="toastContainer"></div>

  <!-- 頂部導覽列 -->
  <header class="h-20 bg-slate-900/95 backdrop-blur border-b border-slate-800 flex items-center justify-between px-3 sm:px-6 z-30 shrink-0 shadow-md">
    <!-- 左側：Logo 與樓層切換 -->
    <div class="flex items-center space-x-3 sm:space-x-4">
      <div class="w-12 h-12 rounded-xl bg-slate-800 p-1 flex items-center justify-center border border-slate-700 shadow-inner">
        <svg viewBox="0 0 100 60" class="w-full h-full">
          <path d="M5 45 Q 50 15 95 45" fill="none" stroke="url(#domeGrad)" stroke-width="8" stroke-linecap="round"/>
          <path d="M10 38 Q 50 18 90 38" fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="3 3"/>
          <path d="M5 48 C 30 52 70 52 95 48" fill="none" stroke="#0284c7" stroke-width="6"/>
          <defs>
            <linearGradient id="domeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#84cc16"/>
              <stop offset="50%" stop-color="#06b6d4"/>
              <stop offset="100%" stop-color="#0284c7"/>
            </linearGradient>
          </defs>
        </svg>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="font-bold text-base sm:text-lg tracking-wide text-white leading-tight">臺北大巨蛋巡檢系統</h1>
          <span class="bg-amber-500/20 text-amber-300 border border-amber-500/40 text-xs px-2 py-0.5 rounded font-mono font-bold">v2026.11.04</span>
          <span id="syncStatusBadge" onclick="openModal('cloudConfigModal')" class="cursor-pointer inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/25 transition">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
            <span id="syncStatusText">雲端連線</span>
          </span>
        </div>
        <p id="currentProjectHeaderSummary" onclick="openModal('projectHeaderModal')" class="text-xs text-amber-300 cursor-pointer hover:underline mt-0.5 flex items-center gap-1">
          <i class="fa-solid fa-file-signature"></i> 專案抬頭：未設定 (點擊填寫活動名稱與租用單位)
        </p>
      </div>

      <!-- 樓層圖資選擇 -->
      <div class="relative ml-1 sm:ml-3">
        <select id="mapSelect" onchange="switchMap(this.value)" class="bg-slate-800 text-amber-400 font-bold text-sm sm:text-base rounded-lg pl-3 pr-8 py-2 border border-slate-700 cursor-pointer appearance-none">
          <option value="map-b2-b1">📍 B2 / B1 地下層區</option>
          <option value="map-l1-l5">📍 L1 ~ L5 看台與場館區</option>
        </select>
        <i class="fa-solid fa-chevron-down text-xs text-slate-400 absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
      </div>
    </div>

    <!-- 中間：即時統計與視圖切換 -->
    <div class="flex items-center space-x-3">
      <div class="flex bg-slate-800 rounded-lg p-1 border border-slate-700 text-sm">
        <button id="btnMapView" onclick="switchView('map')" class="px-3 py-2 rounded-md bg-amber-500 text-slate-950 font-bold transition flex items-center gap-1.5">
          <i class="fa-solid fa-map"></i> 地圖模式
        </button>
        <button id="btnListView" onclick="switchView('list')" class="px-3 py-2 rounded-md text-slate-300 hover:text-white transition flex items-center gap-1.5">
          <i class="fa-solid fa-table-list"></i> 案件列表
          <span id="totalBadge" class="bg-slate-700 text-amber-400 text-xs px-2 py-0.5 rounded-full font-bold">0</span>
        </button>
      </div>
    </div>

    <!-- 右側：工具與權限按鈕 -->
    <div class="flex items-center space-x-2">
      <button onclick="openModal('projectHeaderModal')" class="px-3 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-sm transition flex items-center gap-1 shadow" title="設定專案抬頭 (活動名稱與租用單位)">
        <i class="fa-solid fa-pen-nib"></i> <span class="hidden md:inline">抬頭設定</span>
      </button>

      <button onclick="exportAppendix24ModeA()" class="px-3 py-2 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-sm transition flex items-center gap-1 shadow" title="匯出【附件二十四】官方 A4 表單 (模式 A)">
        <i class="fa-solid fa-file-export"></i> <span class="hidden md:inline">匯出附件二十四</span>
      </button>

      <button id="btnLogin" onclick="openModal('loginModal')" class="flex items-center bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-sm px-3.5 py-2 rounded-lg border border-amber-400 transition shadow">
        <i id="roleIcon" class="fa-solid fa-eye mr-1.5"></i>
        <span id="userRoleText">訪客 (唯讀)</span>
      </button>
    </div>
  </header>

  <!-- 主要內容區 -->
  <main class="flex-1 relative overflow-hidden">

    <!-- 1. 地圖檢視容器 -->
    <div id="viewport" class="w-full h-full relative overflow-hidden bg-slate-950 touch-none cursor-grab active:cursor-grabbing">
      
      <div class="absolute top-3 left-3 z-20 pointer-events-none flex flex-wrap items-center gap-2">
        <div id="mapHintBanner" class="bg-slate-900/90 backdrop-blur-md border border-slate-700/80 text-slate-100 px-3.5 py-2 rounded-lg text-sm flex items-center gap-2 shadow-lg">
          <i class="fa-solid fa-circle-info text-amber-400 text-base"></i>
          <span id="mapActionHint">目前為<strong>訪客唯讀模式</strong>：可拖曳縮放與點擊檢視點位；欲新增點位請點擊右上角解鎖管理權限。</span>
        </div>
      </div>

      <div id="mapLoadingOverlay" class="absolute inset-0 z-20 bg-slate-950/80 backdrop-blur-sm flex flex-col items-center justify-center transition-opacity duration-300">
        <div class="w-12 h-12 border-4 border-amber-500 border-t-transparent rounded-full animate-spin mb-3"></div>
        <p class="text-base font-bold text-amber-400">正在載入大巨蛋巡檢平面圖...</p>
      </div>

      <div id="mapStage" class="absolute top-0 left-0 origin-top-left will-change-transform select-none">
        <div id="mapWrapper" class="relative inline-block">
          <img id="mapImage" src="" alt="臺北大巨蛋巡檢平面圖" onload="onMapLoaded()" onerror="onMapError()" class="block max-w-none select-none pointer-events-none">
          <div id="pinLayer" class="absolute inset-0 pointer-events-auto"></div>
        </div>
      </div>

      <div class="absolute bottom-5 right-5 z-20 flex flex-col gap-2.5">
        <div class="bg-slate-900/90 backdrop-blur border border-slate-700 rounded-xl p-3 text-sm space-y-2 shadow-xl mb-1">
          <div class="flex items-center justify-between gap-4">
            <span class="flex items-center gap-2 text-slate-200 font-medium"><span class="w-3.5 h-3.5 rounded-full bg-rose-500 inline-block border border-white"></span> 待修復</span>
            <strong id="legendPending" class="text-rose-400 text-base">0</strong>
          </div>
          <div class="flex items-center justify-between gap-4">
            <span class="flex items-center gap-2 text-slate-200 font-medium"><span class="w-3.5 h-3.5 rounded-full bg-emerald-500 inline-block border border-white"></span> 已修復</span>
            <strong id="legendCompleted" class="text-emerald-400 text-base">0</strong>
          </div>
        </div>

        <div class="bg-slate-900/90 backdrop-blur border border-slate-700 rounded-xl overflow-hidden flex flex-col shadow-xl">
          <button onclick="zoomMap(1.25)" class="touch-btn hover:bg-slate-800 text-slate-200 hover:text-amber-400 transition border-b border-slate-800" title="放大圖資">
            <i class="fa-solid fa-magnifying-glass-plus text-xl"></i>
          </button>
          <div id="zoomLevelText" class="text-xs font-mono text-center py-1.5 bg-slate-950/60 text-amber-400 font-bold">100%</div>
          <button onclick="zoomMap(0.8)" class="touch-btn hover:bg-slate-800 text-slate-200 hover:text-amber-400 transition border-t border-b border-slate-800" title="縮小圖資">
            <i class="fa-solid fa-magnifying-glass-minus text-xl"></i>
          </button>
          <button onclick="fitMapToScreen()" class="touch-btn hover:bg-slate-800 text-slate-200 hover:text-amber-400 transition" title="自動適應螢幕大小">
            <i class="fa-solid fa-expand text-xl"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- 2. 列表檢視容器 -->
    <div id="listViewContainer" class="hidden w-full h-full p-3 sm:p-6 overflow-y-auto bg-slate-900 select-text">
      <div class="max-w-7xl mx-auto space-y-5 pb-12">

        <div class="no-print flex flex-col md:flex-row justify-between items-stretch md:items-center gap-3.5 bg-slate-800 p-4 rounded-xl border border-slate-700 shadow">
          <div class="flex flex-wrap items-center gap-3">
            <div class="flex items-center space-x-2">
              <span class="text-sm text-slate-300 font-semibold">圖層：</span>
              <select id="filterMap" onchange="renderListView()" class="bg-slate-700 text-white text-sm rounded-lg px-3 py-2 border border-slate-600">
                <option value="all">全部樓層區域</option>
                <option value="map-b2-b1">B2 / B1 地下層</option>
                <option value="map-l1-l5">L1 ~ L5 看台區</option>
              </select>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button onclick="exportSelectedAppendix24ModeB()" class="touch-btn px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-sm transition shadow flex items-center gap-1.5">
              <i class="fa-solid fa-square-check"></i> 匯出勾選項目 (模式 B)
            </button>
          </div>
        </div>

        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
          <div class="overflow-x-auto">
            <table class="w-full text-left text-sm sm:text-base text-slate-200">
              <thead class="bg-slate-700/80 text-slate-100 uppercase text-sm border-b border-slate-600">
                <tr>
                  <th class="py-4 px-3 w-12 text-center no-print"><input type="checkbox" onchange="toggleSelectAllPins(this.checked)" class="w-5 h-5 accent-amber-500"></th>
                  <th class="py-4 px-4">狀態</th>
                  <th class="py-4 px-4">活動 / 租用單位</th>
                  <th class="py-4 px-4">損壞標題與描述</th>
                  <th class="py-4 px-4">預計修復方式</th>
                  <th class="py-4 px-4">現場照片</th>
                  <th class="py-4 px-4 text-right no-print">操作</th>
                </tr>
              </thead>
              <tbody id="pinTableBody" class="divide-y divide-slate-700/70">
                <!-- 由 JS 動態渲染 -->
              </tbody>
            </table>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- 彈窗 0：專案抬頭設定 Modal -->
  <div id="projectHeaderModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 rounded-2xl border border-indigo-500/50 max-w-lg w-full p-6 text-slate-100 relative shadow-2xl">
      <button onclick="closeModal('projectHeaderModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-lg bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xl"><i class="fa-solid fa-file-signature"></i></div>
        <h2 class="text-xl font-bold text-white">專案抬頭設定 (附件二十四)</h2>
      </div>
      <p class="text-xs text-slate-300 mb-4">設定後新增點位時將自動帶入活動與租用單位抬頭資訊，無須每筆重複填寫。</p>
      
      <form onsubmit="saveGlobalProjectHeader(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1">活動名稱 (activity_name)</label>
          <input type="text" id="globalActivityName" placeholder="例如：2026 職棒總冠軍賽" class="w-full bg-slate-900 rounded-lg p-3 text-base border border-slate-600 text-white">
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">租用單位 (renter_unit)</label>
          <input type="text" id="globalRenterUnit" placeholder="例如：○○棒球協會 / ○○娛樂" class="w-full bg-slate-900 rounded-lg p-3 text-base border border-slate-600 text-white">
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-sm font-semibold mb-1">租用開始時間 (rent_start_date)</label>
            <input type="datetime-local" id="globalRentStartDate" class="w-full bg-slate-900 rounded-lg p-3 text-base border border-slate-600 text-white">
          </div>
          <div>
            <label class="block text-sm font-semibold mb-1">租用結束時間 (rent_end_date)</label>
            <input type="datetime-local" id="globalRentEndDate" class="w-full bg-slate-900 rounded-lg p-3 text-base border border-slate-600 text-white">
          </div>
        </div>
        <div class="pt-2">
          <button type="submit" class="touch-btn w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-lg text-base transition shadow">
            儲存專案抬頭
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗 1：身分驗證切換 Modal -->
  <div id="loginModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-4 z-50">
    <div class="bg-slate-800 rounded-2xl border border-slate-700 max-w-md w-full p-6 text-slate-100 relative shadow-2xl">
      <button onclick="closeModal('loginModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
      <div class="flex items-center gap-3 mb-2">
        <div class="w-10 h-10 rounded-lg bg-amber-500/20 text-amber-400 flex items-center justify-center text-lg"><i class="fa-solid fa-user-shield"></i></div>
        <h2 class="text-xl font-bold text-white">巡檢權限切換</h2>
      </div>
      <form onsubmit="event.preventDefault(); submitAuthPassword();" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1.5">授權通行碼 (請輸入 admin 或 superadmin)</label>
          <input type="password" id="inputAuthPassword" autocomplete="off" placeholder="請輸入通行密碼..." class="w-full bg-slate-900 rounded-lg p-3 text-base border border-slate-600 text-white">
        </div>
        <div class="flex flex-col gap-2 pt-1">
          <button type="submit" class="touch-btn w-full py-3 bg-amber-500 text-slate-950 font-bold rounded-lg text-base">解鎖權限</button>
          <button type="button" onclick="resetToGuestRole()" class="touch-btn w-full py-2.5 bg-slate-700 text-slate-200 rounded-lg text-sm">切回訪客模式 (唯讀)</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 彈窗 2：新增 / 編輯巡檢點位 Modal -->
  <div id="pinModal" class="fixed inset-0 bg-black/75 backdrop-blur-sm hidden items-center justify-center p-3 sm:p-4 z-50">
    <div class="bg-slate-800 rounded-2xl border border-slate-700 max-w-xl w-full p-5 sm:p-6 text-slate-100 relative max-h-[92vh] overflow-y-auto shadow-2xl">
      <button onclick="closeModal('pinModal')" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl"><i class="fa-solid fa-xmark"></i></button>
      
      <div class="flex items-center gap-2.5 mb-4">
        <i class="fa-solid fa-location-crosshairs text-amber-400 text-xl"></i>
        <h2 id="pinModalTitle" class="text-xl font-bold text-white">新增損壞巡檢點</h2>
      </div>
      
      <form id="pinForm" onsubmit="handleSavePin(event)" class="space-y-4">
        <input type="hidden" id="formPinId">
        <input type="hidden" id="formMapId">
        <input type="hidden" id="formCoordX">
        <input type="hidden" id="formCoordY">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-900/80 p-3 rounded-xl border border-slate-700">
          <div>
            <label class="block text-xs font-semibold text-slate-400">活動名稱</label>

  <!-- 核心邏輯腳本 -->
  <script>
    const ROLES = { VISITOR: 'guest', ADMIN: 'admin', SUPERADMIN: 'superadmin' };
    window.currentRole = ROLES.VISITOR;
    window.currentMapId = 'map-b2-b1';
    window.currentView = 'map';
    window.pins = [];
    window.activeImages = [];
    window.selectedPinIds = new Set();

    window.MAPS = {
      'map-b2-b1': {
        name: 'B2 / B1 地下層區',
        url: 'https://raw.githubusercontent.com/Bond-Taipei-Dome/TaipeiDome-maps/main/taipeidome-map-b2%26b1.jpg',
        cdnUrl: 'https://cdn.jsdelivr.net/gh/Bond-Taipei-Dome/TaipeiDome-maps@main/taipeidome-map-b2%26b1.jpg'
      },
      'map-l1-l5': {
        name: 'L1 ~ L5 看台與場館區',
        url: 'https://raw.githubusercontent.com/Bond-Taipei-Dome/TaipeiDome-maps/main/taipeidome-map-L1toL5.jpg',
        cdnUrl: 'https://cdn.jsdelivr.net/gh/Bond-Taipei-Dome/TaipeiDome-maps@main/taipeidome-map-L1toL5.jpg'
      }
    };

    const DEFAULT_SUPABASE_URL = 'https://pmwnnkemklbeuzupdvlq.supabase.co';
    const DEFAULT_SUPABASE_KEY = 'sb_publishable_XFUvaEUIqj8KKmVAgjpMqA_XpEyI11e';
    let supabaseClient = null;

    function initSupabaseClient() {
      try {
        if (typeof supabase !== 'undefined') {
          supabaseClient = supabase.createClient(DEFAULT_SUPABASE_URL, DEFAULT_SUPABASE_KEY);
        }
      } catch (e) {
        console.warn('Supabase 連線失敗：', e);
      }
    }

    window.generateFallbackBlueprintSVG = function(title) {
      const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
        <rect width="100%" height="100%" fill="#0f172a"/>
        <ellipse cx="800" cy="550" rx="520" ry="380" fill="#1e293b" stroke="#f59e0b" stroke-width="4" stroke-dasharray="12,8"/>
        <text x="800" y="550" font-family="sans-serif" font-size="36" font-weight="bold" fill="#f8fafc" text-anchor="middle">臺北大巨蛋 (${title}) - 備援圖資</text>
      </svg>`;
      return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
    };

    function loadMap(mapId, callback) {
      window.currentMapId = mapId;
      const mapConfig = window.MAPS[mapId];
      const mapImg = document.getElementById('mapImage');
      const overlay = document.getElementById('mapLoadingOverlay');
      if (!mapImg || !mapConfig) return;

      if (overlay) overlay.classList.remove('opacity-0', 'pointer-events-none');

      if (mapImg.complete && mapImg.naturalWidth && mapImg.src === mapConfig.url) {
        if (overlay) overlay.classList.add('opacity-0', 'pointer-events-none');
        fitMapToScreen();
        renderPins();
        if (typeof callback === 'function') callback();
        return;
      }

      mapImg.src = mapConfig.url;
    }

    let viewport, mapStage, mapWrapper, mapImg;
    let scale = 1, panX = 0, panY = 0;
    let isPointerDown = false, hasMovedDuringDrag = false;
    let pointerStartX = 0, pointerStartY = 0;
    let isTransformPending = false;

    window.fitMapToScreen = function() {
      viewport = document.getElementById('viewport');
      mapImg = document.getElementById('mapImage');
      if (!viewport || !mapImg) return;

      const vw = viewport.clientWidth || window.innerWidth;
      const vh = viewport.clientHeight || (window.innerHeight - 80);
      const iw = mapImg.naturalWidth || 1600;
      const ih = mapImg.naturalHeight || 1100;

      scale = Math.min((vw * 0.94) / iw, (vh * 0.92) / ih, 1.5);
      panX = (vw - iw * scale) / 2;
      panY = (vh - ih * scale) / 2;
      requestUpdateTransform();
    };

    function requestUpdateTransform() {
      if (!isTransformPending) {
        isTransformPending = true;
        requestAnimationFrame(() => {
          mapStage = document.getElementById('mapStage');
          if (mapStage) {
            mapStage.style.transform = `translate3d(${panX}px, ${panY}px, 0px) scale(${scale})`;
            const zoomText = document.getElementById('zoomLevelText');
            if (zoomText) zoomText.innerText = `${Math.round(scale * 100)}%`;
          }
          isTransformPending = false;
        });
      }
    }

    function setupMapInteractions() {
      viewport = document.getElementById('viewport');
      mapWrapper = document.getElementById('mapWrapper');
      if (!viewport || !mapWrapper) return;

      // Mouse 事件
      viewport.addEventListener('mousedown', (e) => {
        if (e.button !== 0 || e.target.closest('.custom-pin')) return;
        isPointerDown = true;
        hasMovedDuringDrag = false;
        pointerStartX = e.clientX;
        pointerStartY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if (!isPointerDown) return;
        const dx = e.clientX - pointerStartX;
        const dy = e.clientY - pointerStartY;
        if (Math.hypot(dx, dy) > 8) hasMovedDuringDrag = true;
        if (hasMovedDuringDrag) {
          panX += dx;
          panY += dy;
          pointerStartX = e.clientX;
          pointerStartY = e.clientY;
          requestUpdateTransform();
        }
      });

      window.addEventListener('mouseup', () => { isPointerDown = false; });

      // Touch 觸控事件
      viewport.addEventListener('touchstart', (e) => {
        if (e.target.closest('.custom-pin')) return;
        if (e.touches.length === 1) {
          isPointerDown = true;
          hasMovedDuringDrag = false;
          pointerStartX = e.touches[0].clientX;
          pointerStartY = e.touches[0].clientY;
        }
      }, { passive: true });

      viewport.addEventListener('touchmove', (e) => {
        if (e.touches.length === 1 && isPointerDown) {
          const dx = e.touches[0].clientX - pointerStartX;
          const dy = e.touches[0].clientY - pointerStartY;
          if (Math.hypot(dx, dy) > 8) hasMovedDuringDrag = true;
          if (hasMovedDuringDrag) {
            panX += dx;
            panY += dy;
            pointerStartX = e.touches[0].clientX;
            pointerStartY = e.touches[0].clientY;
            requestUpdateTransform();
          }
        }
      }, { passive: true });

      viewport.addEventListener('touchend', () => { isPointerDown = false; });

      // 點擊地圖新增點位
      mapWrapper.addEventListener('click', (e) => {
        if (hasMovedDuringDrag || e.target.closest('.custom-pin')) return;

        if (window.currentRole === ROLES.VISITOR) {
          showToast('訪客為唯讀模式，請先解鎖權限！', 'info');
          openModal('loginModal');
          return;
        }

        mapImg = document.getElementById('mapImage');
        const rect = mapImg.getBoundingClientRect();
        if (!rect.width || !rect.height) return;

        const xPercent = Math.min(Math.max(((e.clientX - rect.left) / rect.width) * 100, 0), 100);
        const yPercent = Math.min(Math.max(((e.clientY - rect.top) / rect.height) * 100, 0), 100);

        openPinModalForCreate(xPercent, yPercent);
      });
    }

    function openPinModalForCreate(x, y) {
      document.getElementById('pinModalTitle').innerText = '新增損壞巡檢點';
      document.getElementById('pinForm').reset();
      document.getElementById('formPinId').value = '';
      document.getElementById('formMapId').value = window.currentMapId;
      document.getElementById('formCoordX').value = x.toFixed(2);
      document.getElementById('formCoordY').value = y.toFixed(2);

      const headerRaw = localStorage.getItem('dome_global_project_header');
      if (headerRaw) {
        const header = JSON.parse(headerRaw);
        if (header.activity) document.getElementById('formActivityName').value = header.activity;
        if (header.unit) document.getElementById('formRenterUnit').value = header.unit;
      }

      document.getElementById('formDamageDate').value = new Date().toISOString().split('T')[0];
      window.activeImages = [];
      renderPhotoPreviews();
      openModal('pinModal');
    }

    window.zoomMap = function(factor) {
      scale = Math.min(Math.max(0.2, scale * factor), 5);
      requestUpdateTransform();
    };

    window.switchMap = function(mapId) { loadMap(mapId); };
    window.switchView = function(view) {
      window.currentView = view;
      document.getElementById('viewport')?.classList.toggle('hidden', view !== 'map');
      document.getElementById('listViewContainer')?.classList.toggle('hidden', view !== 'list');
      if (view === 'map') renderPins();
      else renderListView();
    };

    window.toggleRepairOptionFields = function(val) {
      document.getElementById('selfRepairArea')?.classList.toggle('hidden', val !== 'self');
      document.getElementById('paidRepairNotice')?.classList.toggle('hidden', val !== 'paid');
    };

    window.saveGlobalProjectHeader = function(e) {
      if (e) e.preventDefault();
      const activity = document.getElementById('globalActivityName')?.value.trim();
      const unit = document.getElementById('globalRenterUnit')?.value.trim();
      const start = document.getElementById('globalRentStartDate')?.value;
      const end = document.getElementById('globalRentEndDate')?.value;

      localStorage.setItem('dome_global_project_header', JSON.stringify({ activity, unit, start, end }));
      const summary = document.getElementById('currentProjectHeaderSummary');
      if (summary) summary.innerHTML = `<i class="fa-solid fa-file-signature"></i> 專案抬頭：${activity || '未指定'} (${unit || '未指定'})`;

      closeModal('projectHeaderModal');
      showToast('已更新專案抬頭！', 'success');
    };

    window.handlePhotoUpload = function(e) {
      const files = e.target.files;
      if (!files || files.length === 0) return;
      Array.from(files).slice(0, 5 - window.activeImages.length).forEach(file => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          window.activeImages.push(ev.target.result);
          renderPhotoPreviews();
        };
        reader.readAsDataURL(file);
      });
      e.target.value = '';
    };

    function renderPhotoPreviews() {
      const area = document.getElementById('photoPreviewArea');
      const countLabel = document.getElementById('photoCountLabel');
      if (countLabel) countLabel.innerText = `${window.activeImages.length} / 5`;
      if (!area) return;
      area.innerHTML = window.activeImages.map((src, idx) => `
        <div class="relative w-16 h-16 border border-slate-600 rounded-xl overflow-hidden shadow">
          <img src="${src}" class="w-full h-full object-cover">
          <button type="button" onclick="window.activeImages.splice(${idx},1); renderPhotoPreviews();" class="absolute top-1 right-1 bg-rose-600 text-white rounded-full w-5 h-5 text-xs">×</button>
        </div>
      `).join('');
    }

    window.handleSavePin = async function(e) {
      if (e) e.preventDefault();
      const title = document.getElementById('formTitle')?.value.trim();
      if (!title) return showToast('請填寫損壞標題！', 'error');

      const pinData = {
        id: document.getElementById('formPinId')?.value || ('pin-' + Date.now()),
        map_id: document.getElementById('formMapId')?.value || window.currentMapId,
        x: parseFloat(document.getElementById('formCoordX')?.value || 50),
        y: parseFloat(document.getElementById('formCoordY')?.value || 50),
        title,
        activity_name: document.getElementById('formActivityName')?.value,
        renter_unit: document.getElementById('formRenterUnit')?.value,
        damage_date: document.getElementById('formDamageDate')?.value,
        restore_date: document.getElementById('formRestoreDate')?.value,
        repair_option: document.querySelector('input[name="formRepairOption"]:checked')?.value,
        constructor_name: document.getElementById('formConstructorName')?.value,
        construct_date: document.getElementById('formConstructDate')?.value,
        description: document.getElementById('formDescription')?.value,
        images: [...window.activeImages]
      };

      const idx = window.pins.findIndex(p => String(p.id) === String(pinData.id));
      if (idx >= 0) window.pins[idx] = pinData;
      else window.pins.unshift(pinData);

      if (supabaseClient) {
        try { await supabaseClient.from('pins').upsert(pinData); } catch (err) {}
      }

      closeModal('pinModal');
      renderPins();
      showToast('巡檢點位儲存成功！', 'success');
    };

    window.exportAppendix24ModeA = function() {
      const headerRaw = localStorage.getItem('dome_global_project_header');
      const header = headerRaw ? JSON.parse(headerRaw) : {};
      generateAppendix24Printout(window.pins, header);
    };

    window.exportSelectedAppendix24ModeB = function() {
      if (window.selectedPinIds.size === 0) return showToast('請先勾選案件！', 'error');
      const pinsToExport = window.pins.filter(p => window.selectedPinIds.has(String(p.id)));
      const headerRaw = localStorage.getItem('dome_global_project_header');
      const header = headerRaw ? JSON.parse(headerRaw) : {};
      generateAppendix24Printout(pinsToExport, header);
    };

    function formatDateTimeDisplay(dtStr) {
      if (!dtStr) return '年 月 日 時 分';
      return dtStr.replace('T', ' ');
    }

              <tr style="background-color:#f1f5f9;">

    window.submitAuthPassword = function() {
      const pwd = document.getElementById('inputAuthPassword')?.value.trim();
      if (pwd === 'admin') {
        window.currentRole = ROLES.ADMIN;

      } else if (pwd === 'superadmin') {
        window.currentRole = ROLES.SUPERADMIN;
        showToast('已解鎖：超級管理員權限', 'success');

        return showToast('通行碼錯誤', 'error');
      }
      closeModal('loginModal');

      window.currentRole = ROLES.VISITOR;
      closeModal('loginModal');
      showToast('已切回訪客模式', 'info');
    };

    window.openModal = function(id) { document.getElementById(id)?.classList.remove('hidden'); };
    window.closeModal = function(id) { document.getElementById(id)?.classList.add('hidden'); };

    function showToast(msg, type = 'info') {
      const container = document.getElementById('toastContainer');
      if (!container) return;
      const toast = document.createElement('div');
      toast.className = `toast-item px-4 py-2.5 rounded-xl border text-sm font-semibold shadow-2xl backdrop-blur ${type === 'success' ? 'bg-emerald-600 text-white' : 'bg-slate-800 text-amber-300 border-amber-500'}`;
      toast.innerText = msg;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function renderPins() {
      const layer = document.getElementById('pinLayer');
      if (!layer) return;
      layer.innerHTML = '';
      (window.pins || []).filter(p => p.map_id === window.currentMapId).forEach(pin => {
        const el = document.createElement('div');
        el.className = 'custom-pin pin-unrestored';
        el.style.left = `${pin.x}%`;
        el.style.top = `${pin.y}%`;
        el.innerHTML = '<i class="fa-solid fa-exclamation"></i>';
        layer.appendChild(el);
      });
    }

    function renderListView() {
      const tbody = document.getElementById('pinTableBody');
      if (!tbody) return;
      tbody.innerHTML = (window.pins || []).map(pin => `
        <tr class="hover:bg-slate-700/40">
          <td class="py-4 px-3 text-center"><input type="checkbox" value="${pin.id}" onchange="toggleSelectPin('${pin.id}', this.checked)" class="w-5 h-5 accent-amber-500"></td>
          <td class="py-4 px-4"><span class="bg-rose-500/20 text-rose-300 px-2.5 py-1 rounded-full text-xs font-bold">待修復</span></td>
          <td class="py-4 px-4 text-xs"><div>${pin.activity_name || '通用'}</div><div class="text-slate-400">${pin.renter_unit || '通用'}</div></td>
          <td class="py-4 px-4 font-bold">${pin.title || '無標題'}</td>
          <td class="py-4 px-4 text-xs">${pin.repair_option === 'paid' ? '付費維修' : '自行修復'}</td>
          <td class="py-4 px-4">${(pin.images && pin.images[0]) ? `<img src="${pin.images[0]}" class="w-10 h-10 object-cover rounded">` : '無照片'}</td>
          <td class="py-4 px-4 text-right"><button onclick="locatePinOnMap('${pin.id}')" class="px-3 py-1 bg-slate-700 text-amber-300 rounded text-xs">定位</button></td>
        </tr>
      `).join('');
    }

    window.toggleSelectPin = function(id, checked) {
      if (checked) window.selectedPinIds.add(String(id));
      else window.selectedPinIds.delete(String(id));
    };

    window.toggleSelectAllPins = function(checked) {
      if (checked) window.pins.forEach(p => window.selectedPinIds.add(String(p.id)));
      else window.selectedPinIds.clear();
      renderListView();
    };

    window.locatePinOnMap = function(id) {
      const pin = window.pins.find(p => String(p.id) === String(id));
      if (!pin) return;
      switchView('map');
      loadMap(pin.map_id, () => {
        panX = (viewport.clientWidth / 2) - ((pin.x / 100) * (mapImg.naturalWidth || 1600) * scale);
        panY = (viewport.clientHeight / 2) - ((pin.y / 100) * (mapImg.naturalHeight || 1100) * scale);
        requestUpdateTransform();
      });
    };

    window.addEventListener('DOMContentLoaded', () => {
      initSupabaseClient();
      setupMapInteractions();
      loadMap(window.currentMapId);
    });
  </script>
</body>
</html>
